<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>/*TITLE*/ — Franchise Cinematic</title>
<style>/*FONTS*/
html,body{margin:0;background:#000;color:#d8cdb8;font-family:'Barlow Condensed',sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
canvas{width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;display:block}
.bar{display:flex;gap:10px;align-items:center;width:100%;max-width:1280px;flex-wrap:wrap}
button{font:600 16px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;background:#151515;color:#eee;border:1px solid #555;padding:10px 16px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}.tc{font-variant-numeric:tabular-nums;min-width:86px;letter-spacing:.08em}
</style></head><body><div class="wrap"><canvas id="c" width="1920" height="1080"></canvas>
<div class="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="45" step="0.0333" value="0"><span class="tc" id="tc">00.00 / 45.00</span></div></div>
<audio id="au" preload="auto" src="/*AUDIO*/"></audio>
<script>const CFG=/*CFG*/;
/*CORE*/
/*THEMES*/
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),au=document.getElementById('au'),scrub=document.getElementById('scrub'),tc=document.getElementById('tc');
let playing=false,t0=0,cur=0;
function show(t){cur=t;render(ctx,t);scrub.value=t;tc.textContent=t.toFixed(2).padStart(5,'0')+' / 45.00'}
function loop(){if(!playing)return;let t=au.src&&!au.paused?au.currentTime:(performance.now()-t0)/1000;if(t>=DUR){stop();show(DUR-.001);return}show(t);requestAnimationFrame(loop)}
function start(from){playing=true;t0=performance.now()-from*1000;try{au.currentTime=from;au.play().catch(()=>{})}catch(e){}document.getElementById('play').textContent='Pause';requestAnimationFrame(loop)}
function stop(){playing=false;au.pause();document.getElementById('play').textContent='Play'}
document.getElementById('play').onclick=()=>playing?stop():start(cur>=DUR-.05?0:cur);
scrub.oninput=()=>{stop();show(+scrub.value)};
window.__ready=document.fonts.ready.then(async()=>{await Promise.all(["900 100px Cinzel","700 40px Cinzel","500 26px Cinzel","600 30px 'Barlow Condensed'","900 100px Orbitron","700 30px Orbitron","400 100px 'Bebas Neue'"].map(f=>document.fonts.load(f)));initTex();show(0);return true});
window.__frame=(t,q)=>{render(ctx,t);return cv.toDataURL('image/jpeg',q||.92)};
</script></body></html>
