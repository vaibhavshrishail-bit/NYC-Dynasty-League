<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Pantheon — Franchise Cinematic</title>
<style>/*FONTS*/
html,body{margin:0;background:#000;color:#d8cdb8;font-family:'Barlow Condensed',sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
canvas{width:100%;max-width:1280px;aspect-ratio:16/9;background:#000;display:block}
.bar{display:flex;gap:10px;align-items:center;width:100%;max-width:1280px;flex-wrap:wrap}
button{font:600 16px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;background:#17120b;color:#f3d7a0;border:1px solid #6b4a22;padding:10px 16px;cursor:pointer}
button:hover{background:#241a0e}input[type=range]{flex:1;min-width:140px;accent-color:#c9995a}.tc{font-variant-numeric:tabular-nums;min-width:86px;letter-spacing:.08em}
#msg{font-size:14px;letter-spacing:.06em;opacity:.75;max-width:1280px;width:100%}
</style></head><body><div class="wrap"><canvas id="c" width="1920" height="1080"></canvas>
<div class="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="25" step="0.0333" value="0"><span class="tc" id="tc">00.00 / 25.00</span><button id="exp">Export video</button></div>
<div id="msg"></div></div>
<audio id="au" preload="auto" src="/*AUDIO*/"></audio>
<script>/*CINE*/
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),au=document.getElementById('au'),scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),msg=document.getElementById('msg');
let playing=false,t0=0,cur=0;
function show(t){cur=t;render(ctx,t);scrub.value=t;tc.textContent=t.toFixed(2).padStart(5,'0')+' / 25.00'}
function loop(){if(!playing)return;let t=au.src&&!au.paused?au.currentTime:(performance.now()-t0)/1000;if(t>=DUR){stop();show(DUR-.001);return}show(t);requestAnimationFrame(loop)}
function start(from){playing=true;t0=performance.now()-from*1000;try{au.currentTime=from;au.play().catch(()=>{})}catch(e){}document.getElementById('play').textContent='Pause';requestAnimationFrame(loop)}
function stop(){playing=false;au.pause();document.getElementById('play').textContent='Play'}
document.getElementById('play').onclick=()=>playing?stop():start(cur>=DUR-.05?0:cur);
scrub.oninput=()=>{stop();show(+scrub.value)};
document.getElementById('exp').onclick=async()=>{ // real-time capture of canvas + soundtrack
  if(!window.MediaRecorder){msg.textContent='This browser cannot record the canvas. Use the rendered MP4 instead.';return}
  stop();const vs=cv.captureStream(30);let tracks=[...vs.getVideoTracks()];
  try{const ac=new AudioContext(),src=ac.createMediaElementSource(au),dst=ac.createMediaStreamDestination();src.connect(dst);src.connect(ac.destination);tracks.push(...dst.stream.getAudioTracks())}catch(e){}
  const type=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:type,videoBitsPerSecond:12e6}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download='the-pantheon-cinematic.'+(type.includes('mp4')?'mp4':'webm');a.click();msg.textContent='Export saved.'};
  msg.textContent='Recording in real time (25s)…';rec.start();start(0);setTimeout(()=>rec.stop(),DUR*1000+300)};
window.__ready=document.fonts.ready.then(async()=>{await Promise.all(["900 100px Cinzel","700 40px Cinzel","500 26px Cinzel","600 30px 'Barlow Condensed'"].map(f=>document.fonts.load(f)));initTex();show(0);return true});
window.__frame=(t,q)=>{render(ctx,t);return cv.toDataURL('image/jpeg',q||.92)};
</script></body></html>
