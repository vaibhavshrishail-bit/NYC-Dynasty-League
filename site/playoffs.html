<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Playoff War Room — NYC Dynasty League</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:26px;padding-bottom:50px"><div class="k" id="sub">Playoff war room</div><h1 class="h-page">What if?</h1><div id="sn"></div>
<div id="page"><p class="loading">Running 8,000 simulated seasons…</p></div><footer id="foot"></footer></div>
<script src="assets/app.js"></script><script src="assets/sim.js"></script><script>
document.getElementById('nav').innerHTML=nav('Playoffs');document.getElementById('sn').innerHTML=subnav('What if?');
loadAll().then(([c,L])=>{
  const T=(id)=>c.byRoster[id],fl=(id)=>`<a href="franchise.html?f=${esc(T(id).slug)}">${esc(T(id).team_name)}</a>`,wk=String(L.current_week),games=L.schedule[wk]||[],forced={},swk=Object.keys(L.schedule);let tab=swk[0];
  const tw=thisWeek(c,L),pg=document.getElementById('page'),base=simulate(c,L),open=new Set(location.hash==='#draft'?['draft']:[]);
  let me=(c.franchises.find((f)=>f.slug===myTeam.get())||T(c.standings[c.playoff_teams-1])).roster_id;
  const cond=(id)=>topFiveNote(tw,id),gameOf=(id)=>games.find((g)=>g.includes(id)),keyOf=(g)=>`${wk}:${g[0]}-${g[1]}`;
  function draw(){
    pg.querySelectorAll('details[data-f]').forEach((d)=>d.open?open.add(d.dataset.f):open.delete(d.dataset.f));
    const nF=Object.keys(forced).length,sim=nF?simulate(c,L,forced):base,order=c.standings.map(T);
    const rows=order.map((f)=>{const id=f.roster_id,s=sim[id],b=base[id],d=s.playoff-b.playoff,bs=s.seed.indexOf(Math.max(...s.seed))+1;
      return `<tr><td>${f.seed}</td><td>${fl(id)}</td><td class="num">${esc(f.record)}</td><td class="num">${f.pf.toFixed(1)}</td><td class="num">${s.wins.toFixed(1)}</td><td class="num"><b>${pct(s.playoff)}</b>${nF&&Math.abs(d)>=.01?` <span style="color:${d>0?'#6fe39b':'#ff8b7a'}">${d>0?'+':''}${Math.round(d*100)}</span>`:''}</td><td class="num">${pct(s.top5)}</td><td class="num">${pct(s.sixth)}</td><td class="num">${pct(s.bye)}</td><td class="num">${pct(s.champ)}</td><td class="num">${ord(bs)}</td></tr>`}).join('');
    const sosRows=[...order].sort((x,y)=>(L.teams[y.roster_id].sos||0)-(L.teams[x.roster_id].sos||0)).map((f)=>{const t=L.teams[f.roster_id];return `<tr><td>${fl(f.roster_id)}</td><td class="num">${t.sos??'—'}</td><td>${t.remaining.map((o)=>`W${o.week} ${esc(T(o.opp).team_name)}${t.byes&&t.byes[o.week]&&t.byes[o.week].length?` <span class="note">(${t.byes[o.week].length} on bye)</span>`:''}`).join(' · ')||'—'}</td></tr>`}).join('');
    const nonp=[...order].sort((x,y)=>sim[y.roster_id].miss-sim[x.roster_id].miss||y.seed-x.seed);
    const yr=Math.min(...c.franchises.flatMap((f)=>f.future_picks.map((p)=>p.season)));
    const owner={};for(const f of c.franchises)for(const p of f.future_picks)if(p.season===yr&&p.round===1)owner[p.original_roster]=f.roster_id;
    const draftRows=nonp.map((f)=>{const s=sim[f.roster_id],lo=s.slot.findIndex((x)=>x>=.03),hi=5-[...s.slot].reverse().findIndex((x)=>x>=.03),top=s.slot.indexOf(Math.max(...s.slot));
      const now=f.seed>c.playoff_teams?12-f.seed+1:null,o=owner[f.roster_id];
      return `<tr><td>${fl(f.roster_id)}</td><td class="num">${now?'1.'+String(now).padStart(2,'0'):'7–12'}</td><td class="num">${pct(s.miss)}</td><td class="num">${s.miss<.03?'7–12':lo<0?'—':`1.${String(lo+1).padStart(2,'0')}${hi>lo?' – 1.'+String(hi+1).padStart(2,'0'):''}`}</td><td class="num">${s.miss<.03?'—':'1.'+String(top+1).padStart(2,'0')+' ('+pct(s.slot[top])+')'}</td><td>${o===f.roster_id?'Own pick':o?'Owned by '+esc(T(o).team_name):'—'}</td></tr>`}).join('');
    const g=gameOf(me),opp=g?(g[0]===me?g[1]:g[0]):null,k=g?keyOf(g):null,st=k&&forced[k]?(forced[k]===me?'win':'lose'):null,s=sim[me],b=base[me];
    const dl=(x,y)=>{const d=Math.round((x-y)*100);return nF&&d?`<em class="${d>0?'upc':'dnc'}">${d>0?'+':''}${d} pts</em>`:''},cardS=(lab,x,y)=>`<div><span>${lab}</span><b>${nF&&Math.round(x*100)!==Math.round(y*100)?`<i>${pct(y)} → </i>`:''}${pct(x)}</b>${dl(x,y)}</div>`;
    const movers=order.map((f)=>({f,d:sim[f.roster_id].playoff-base[f.roster_id].playoff})).filter((x)=>x.f.roster_id!==me&&Math.abs(x.d)>=.02).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,4);
    const chips=Object.entries(forced).map(([kk,w])=>{const [ww,pr]=kk.split(':'),[x,y]=pr.split('-').map(Number);return `<button class="btn" data-un="${kk}" aria-label="Remove this pick">Wk ${ww}: ${esc(T(w).manager)} beats ${esc(T(w===x?y:x).manager)} ✕</button>`}).join(' ');
    const picks=(L.schedule[tab]||[]).map(([x,y])=>{const kk=`${tab}:${x}-${y}`;return `<div class="pick"><button aria-pressed="${forced[kk]===x}" data-k="${kk}" data-w="${x}">${esc(T(x).team_name)}</button><button aria-pressed="${forced[kk]===y}" data-k="${kk}" data-w="${y}">${esc(T(y).team_name)}</button></div>`}).join('');
    const F=(key,title,sub,inner)=>`<details class="fold" data-f="${key}" id="${key}" ${open.has(key)?'open':''}><summary>${title}<small>${sub}</small></summary>${inner}</details>`;
    pg.innerHTML=`
<div class="ask">What happens if <select id="me" aria-label="Franchise">${order.map((f)=>`<option value="${f.roster_id}" ${f.roster_id===me?'selected':''}>${esc(f.manager)}</option>`).join('')}</select> ${g?`${st==='lose'?'loses to':'beats'} ${esc(T(opp).manager)} in Week ${wk}?`:'… has no game left to pick.'}</div>
${g?`<p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ${st==='win'?'pri':''}" data-me="win" aria-pressed="${st==='win'}">${esc(T(me).manager)} wins</button><button class="btn ${st==='lose'?'pri':''}" data-me="lose" aria-pressed="${st==='lose'}">${esc(T(me).manager)} loses</button><button class="btn" id="reset" ${nF?'':'disabled style="opacity:.4"'}>Reset scenario</button></p>`:''}
<p class="k" style="margin-top:14px;color:${nF?'var(--gn)':'#a3a6b0'}">${nF?`Your scenario · ${nF} result${nF>1?'s':''} fixed`:'As things stand · nothing fixed'}</p>${chips?`<p style="display:flex;gap:6px;flex-wrap:wrap">${chips}</p>`:''}
<div class="sc">${cardS('Makes the playoffs',s.playoff,b.playoff)}${cardS('Top-five seed',s.top5,b.top5)}${cardS('First-round bye',s.bye,b.bye)}${cardS('Wins the title',s.champ,b.champ)}</div>
${nF?(movers.length?`<p class="lede" style="max-width:none"><b>Who else it moves:</b> ${movers.map((x)=>`${esc(x.f.manager)} <span class="${x.d>0?'upc':'dnc'}">${x.d>0?'+':''}${Math.round(x.d*100)}</span>`).join(' · ')}</p>`:'<p class="note">Nobody else moves by two points or more.</p>'):`<p class="note">${cond(me)?esc(T(me).manager)+': '+cond(me)+' ':''}Choose a result above, or build a bigger scenario below.</p>`}
<section class="blk"><h3 class="sec">The playoff picture<small>${nF?'under your scenario · change from today in colour':'as things stand'}</small></h3>
${order.map((f,i)=>{const id=f.roster_id,d=Math.round((sim[id].playoff-base[id].playoff)*100);return `${i===c.playoff_teams?'<div class="cutline"><span>PLAYOFF LINE</span></div>':''}<div class="odds" style="--c:${c.themes[f.theme].hi};font-size:18px${id===me?';background:rgba(255,255,255,.05)':''}"><a href="franchise.html?f=${f.slug}">${f.seed}. ${esc(f.manager)} <span class="note">${esc(f.record)}</span></a><span class="p">${pct(sim[id].playoff)}${nF&&d?` <span class="${d>0?'upc':'dnc'}" style="font-size:.7em">${d>0?'+':''}${d}</span>`:''}</span><span class="bar"><i style="width:${(sim[id].playoff*100).toFixed(1)}%"></i></span></div>`}).join('')}
<p class="note">${esc(L.rules.seeding)} Every percentage is simulated. ${esc(L.rules.model)}</p></section>
${F('more','Build a bigger scenario','pick winners in any remaining week',`<div class="tabs" style="margin:0 0 8px">${swk.map((w)=>`<button data-tab="${w}" aria-pressed="${w===tab}">Wk ${w}${Object.keys(forced).filter((kk)=>kk.startsWith(w+':')).length?' ✓':''}</button>`).join('')}</div>${picks||'<p class="note">No regular-season games left.</p>'}<p class="note">Unpicked games stay random. Picking a winner fixes who wins, not the score; points still vary, which is why the sixth seed stays a probability.${tab===wk&&c.week_in_progress?' Week '+wk+' is being played now.':''}</p>`)}
${F('bracket','The bracket',nF?'under your scenario':'if seeds hold',`${(()=>{const exp=[...order].sort((x,y)=>{const m=(f)=>sim[f.roster_id].seed.reduce((a,v,i)=>a+v*(i+1),0);return m(x)-m(y)}).slice(0,c.playoff_teams),B=(i)=>{const f=exp[i],t=c.themes[f.theme];return `<a href="franchise.html?f=${f.slug}" style="display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-decoration:none;padding:6px 8px;border:1px solid ${t.hi}55;background:rgba(${t.flash},.08)">${emblem(t)}<span><b style="color:${t.hi};font-weight:600">${i+1}. ${esc(f.manager)}</b> <span class="note">${esc(f.team_name)}</span></span><span class="note">title ${pct(sim[f.roster_id].champ)}</span></a>`};
  return `<div class="two3" style="align-items:center"><div><div class="k" style="margin-bottom:6px">Week ${c.playoff_week_start}</div>${B(3)}<div class="k" style="text-align:center;margin:3px">v</div>${B(4)}<div style="height:18px"></div>${B(2)}<div class="k" style="text-align:center;margin:3px">v</div>${B(5)}</div>
   <div><div class="k" style="margin-bottom:6px">Week ${c.playoff_week_start+1} · seeds 1 and 2 enter</div>${B(0)}<div class="k" style="text-align:center;margin:3px">v winner of 4/5</div><div style="height:38px"></div>${B(1)}<div class="k" style="text-align:center;margin:3px">v winner of 3/6</div></div>
   <div><div class="k" style="margin-bottom:6px">Week ${c.playoff_week_start+2} · championship</div><div class="panel" style="text-align:center"><span class="k">Most likely champion</span><h3 style="color:${c.themes[[...order].sort((x,y)=>sim[y.roster_id].champ-sim[x.roster_id].champ)[0].theme].hi}">${esc([...order].sort((x,y)=>sim[y.roster_id].champ-sim[x.roster_id].champ)[0].manager)} · ${pct(Math.max(...order.map((f)=>sim[f.roster_id].champ)))}</h3></div></div></div>`})()}<p class="note">Seeds shown are each franchise's most likely finishing position in the simulation. ${esc(L.rules.bracket)} Seeds 1 and 2 have a bye in Week ${c.playoff_week_start}.</p><div class="flag">${esc(L.rules.bracket_flag)}</div>`)}
${F('certain','What is mathematically certain this week','exact, not simulated',`<div class="tw"><table>${order.map((f)=>{const t=cond(f.roster_id);return t?`<tr><td>${fl(f.roster_id)}</td><td>${t}</td></tr>`:''}).join('')||'<tr><td>Nothing can be clinched or lost this week.</td></tr>'}</table></div><p class="note">Checked against every combination of this week's ${games.length} results and the wins still available to each team. The test is deliberately cautious: it may confirm a clinch a week late, never early. The sixth seed is awarded on points, so no team is mathematically eliminated from it before Week ${L.regular_season_end} ends.</p>`)}
${F('table','All the numbers','projected wins, seed odds, title odds',`<div class="tw"><table><tr><th>Seed</th><th>Franchise</th><th class="num">Record</th><th class="num">PF</th><th class="num">Proj. wins</th><th class="num">Make playoffs</th><th class="num">Top five</th><th class="num">Sixth seed</th><th class="num">Bye</th><th class="num">Title</th><th class="num">Likeliest seed</th></tr>${rows.replace(new RegExp(`(<tr><td>${c.playoff_teams+1}</td>)`),'<tr><td colspan="11" style="padding:0"><div class="cutline"><span>PLAYOFF LINE</span></div></td></tr>$1')}</table></div><p class="note">Title odds use the same model for single playoff games.</p>`)}
${F('sched','Remaining schedule','hardest first',`<div class="tw"><table><tr><th>Franchise</th><th class="num">Opp. avg</th><th>Opponents</th></tr>${sosRows}</table></div><p class="note">Opp. avg is the average weekly score of remaining opponents. ${L.nfl_byes?'"On bye" counts last week\'s starters whose NFL team is off that week.':'NFL bye-week data is not available yet, so bye exposure is not shown.'}</p>`)}
${F('draft',yr+' rookie draft order','provisional · rule not confirmed',`<div class="tw"><table><tr><th>Franchise's own first-round pick</th><th class="num">If the season ended today</th><th class="num">Chance of a top-six pick</th><th class="num">Likely range</th><th class="num">Most likely</th><th>Who holds it</th></tr>${draftRows}</table></div><p class="note">${esc(L.rules.draft)} A team's results decide where its original pick lands, whoever owns it now.</p><div class="flag">${esc(L.rules.draft_flag)}</div>`)}
<p class="note" style="margin-top:22px">This page describes the situation; it does not suggest roster moves.</p>`;
    document.getElementById('me').onchange=(e)=>{me=+e.target.value;myTeam.set(T(me).slug);draw()};
    pg.querySelectorAll('[data-me]').forEach((bt)=>bt.onclick=()=>{const w=bt.dataset.me==='win'?me:opp;forced[k]===w?delete forced[k]:forced[k]=w;draw()});
    pg.querySelectorAll('[data-un]').forEach((bt)=>bt.onclick=()=>{delete forced[bt.dataset.un];draw()});
    pg.querySelectorAll('[data-tab]').forEach((b)=>b.onclick=()=>{tab=b.dataset.tab;draw()});
    pg.querySelectorAll('.pick button').forEach((b)=>b.onclick=()=>{const k=b.dataset.k,w=+b.dataset.w;forced[k]===w?delete forced[k]:forced[k]=w;draw()});
    const rs=document.getElementById('reset');if(rs)rs.onclick=()=>{for(const kk in forced)delete forced[kk];draw()};
  }
  draw();const toDraft=()=>{if(location.hash==='#draft'){const d=document.getElementById('draft');d.open=true;d.scrollIntoView()}};toDraft();addEventListener('hashchange',toDraft);document.getElementById('sub').textContent=`Playoff war room · Week ${L.current_week}${c.week_in_progress?' · in progress':''}`;document.getElementById('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
