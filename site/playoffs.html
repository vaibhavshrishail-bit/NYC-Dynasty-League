document.getElementById('nav').innerHTML=nav('Playoffs');
loadLive().then(([c,L,WK,H])=>{
  const $=(id)=>document.getElementById(id),T=(id)=>c.byRoster[id],th=(id)=>c.themes[T(id).theme],M=(id)=>esc(T(id).manager),ids=c.standings,NP=c.playoff_teams;
  const weeks=Object.keys(H.weeks).map(Number).sort((a,b)=>a-b),W=weeks[weeks.length-1],cw=String(L.current_week),games=L.schedule[cw]||[],swk=Object.keys(L.schedule),tw=thisWeek(c,L);
  const narrow=()=>innerWidth<1000,f2=(x)=>x.toFixed(2),keyFor=(w,a,b)=>{const p=(L.schedule[w]||[]).find((g)=>g.includes(a)&&g.includes(b));return p?`${w}:${p[0]}-${p[1]}`:null};
  // ---- shared state: one franchise, one week (null = now), one scenario ----
  const S={me:(c.franchises.find((f)=>f.slug===(new URLSearchParams(location.search).get('f')||myTeam.get()))||T(ids[NP-1])).roster_id,wk:null,forced:{},tab:swk[0]};
  const base=simulate(c,L),CERT=certainty(c,L),cache={};let scen=base;const cp=(id)=>(!S.wk&&!nF()?CERT[id].playoff:null);
  const branch=(id)=>{if(cache[id])return cache[id];const g=games.find((x)=>x.includes(id)),o={g,opp:g?(g[0]===id?g[1]:g[0]):null,key:g?`${cw}:${g[0]}-${g[1]}`:null};
    if(g){o.win=simulate(c,L,{[o.key]:id});o.lose=simulate(c,L,{[o.key]:o.opp})}
    o.lev=L.teams[id].remaining.map((r)=>{const k=keyFor(String(r.week),id,r.opp);if(!k)return null;const w=k===o.key?o.win[id].playoff:simulate(c,L,{[k]:id},4000)[id].playoff,l=k===o.key?o.lose[id].playoff:simulate(c,L,{[k]:r.opp},4000)[id].playoff;return {...r,key:k,win:w,lose:l,swing:w-l,p:winChance(L,id,r.opp)}}).filter(Boolean);
    return cache[id]=o};
  const nF=()=>Object.keys(S.forced).length,odds=(id,i)=>H.weeks[weeks[i]].odds[id].playoff,res=(id,w)=>T(id).results.find((r)=>r.week===w);
  const likeSeed=(s)=>s.seed.indexOf(Math.max(...s.seed))+1,expOrder=(sm)=>[...ids].sort((x,y)=>{const m=(id)=>sm[id].seed.reduce((a,v,i)=>a+v*(i+1),0);return m(x)-m(y)});
  const turning=(id)=>{const o=[];weeks.forEach((w,i)=>{if(!i&&!H.preseason)return;const pv=i?odds(id,i-1):H.preseason.odds[id].playoff,d=odds(id,i)-pv,r=res(id,w);if(Math.abs(d)>=.12&&r)o.push({w,d,short:`${r.result==='W'?'beat':'lost to'} ${T(r.opp).manager}`,txt:`${r.result==='W'?'Beat':'Lost to'} ${T(r.opp).manager} ${f2(r.pf)}–${f2(r.pa)}`,from:pv,to:odds(id,i)})});
    o.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));const top=o.slice(0,3).sort((a,b)=>a.w-b.w);let best=null,cur=null;for(const r of T(id).results){if(cur&&cur.t===r.result){cur.n++;cur.to=r.week}else cur={t:r.result,n:1,from:r.week,to:r.week};if(cur.n>=3&&(!best||cur.n>best.n))best={...cur}}
    return {top,streak:best}};
  function setState(){const n=nF();$('state').innerHTML=n?`<div class="sb hyp"><span>HYPOTHETICAL · ${n} result${n>1?'s':''} fixed<span class="lg"> by you. Every number is recalculated.</span></span><button id="rs1">Reset scenario</button></div>`:S.wk?`<div class="sb his"><span>HISTORICAL · after Week ${S.wk}<span class="lg"> · the race as it stood then (${H.weeks[S.wk].source})</span></span><button id="rc1">Return to current week</button></div>`:'';
    const a=$('rs1'),b=$('rc1');if(a)a.onclick=reset;if(b)b.onclick=()=>{S.wk=null;draw()}}

  // ---- A: the road to the playoffs ----
  function road(){const id=S.me,br=branch(id),col=th(id).hi,nr=narrow(),Wd=nr?Math.min(Math.max(document.getElementById('A').clientWidth,280),720):1100,Hh=nr?(Wd>520?360:310):450,x0=nr?40:58,xm=nr?Math.round(Wd*.61):640,xf=nr?Math.round(Wd*.805):800,x1=nr?Wd-4:1080,y0=34,y1=Hh-48,Y=(p)=>y1-p*(y1-y0),PK=H.preseason?1:0,X=(i)=>x0+(nr?6:10)+(weeks.length-1+PK>0?(i+PK)/(weeks.length-1+PK):0)*(xm-x0-(nr?26:50)),preP=(o)=>PK?`${X(-1).toFixed(1)} ${Y(H.preseason.odds[o].playoff).toFixed(1)}L`:'';

    s+=`<path d="M${PK?X(-1):pts[0][0]} ${y1}L${preP(id)}${pts.map((p)=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}L${nx} ${ny.toFixed(1)}L${nx} ${y1}Z" fill="url(#ga)"/><path class="me" d="M${preP(id)}${pts.map((p)=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')}L${nx} ${ny.toFixed(1)}" stroke="${col}" stroke-width="${nr?4:5}"/>`;
    if(PK){const px=X(-1),py=Y(H.preseason.odds[id].playoff);s+=`<circle cx="${px}" cy="${py}" r="${nr?5:6}" fill="#0f1b2d" stroke="${col}" stroke-width="2" stroke-dasharray="2 2"><title>Preseason expectation: ${pct(H.preseason.odds[id].playoff)}</title></circle><text x="${px}" y="${Hh-24}" text-anchor="middle" fill="#b6c0d0" font-size="${nr?12:13}">PRE</text><text x="${px}" y="${Hh-7}" text-anchor="middle" fill="#b6c0d0" font-size="${nr?12:13}">${pct(H.preseason.odds[id].playoff)}</text>`}
    weeks.forEach((w,i)=>{const r=res(id,w),p=pts[i],sel=i===hi,mark=tp.top.some((t)=>t.w===w);
      if(mark)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${nr?13:15}" fill="none" stroke="#ffd24a" stroke-width="2" stroke-dasharray="3 3"/>`;
      s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${sel?10:nr?6.5:7.5}" fill="${r&&r.result==='W'?col:'#0f1b2d'}" stroke="${sel?'#fff':col}" stroke-width="${sel?4:3}"/>`;
      s+=`<text x="${p[0]}" y="${Hh-24}" text-anchor="middle" fill="${sel?'#fff':'#b6c0d0'}" font-size="${nr?15:15}" font-weight="${sel?700:400}">${nr?w:'Wk '+w}</text><text x="${p[0]}" y="${Hh-7}" text-anchor="middle" fill="${r&&r.result==='W'?'#7fe0aa':'#ff9aa9'}" font-size="${nr?15:13}" font-weight="600">${r?r.result:''}</text>`;
      if(sel)s+=`<line x1="${p[0]}" x2="${p[0]}" y1="${y0}" y2="${y1}" stroke="#fff" opacity=".5"/><text x="${Math.min(Math.max(p[0],x0+26),xm-24)}" y="${Math.max(p[1]-18,y0+6)}" text-anchor="middle" fill="#fff" font-size="${nr?18:20}" font-weight="700">${pct(odds(id,i))}</text>`});
    if(!nr&&hi<0){const used=[];tp.top.forEach((t)=>{const i=weeks.indexOf(t.w),p=pts[i],up=p[1]>y0+70;let ty=up?p[1]-34:p[1]+46;const tx=Math.min(Math.max(p[0],x0+120),xm-130);while(used.some((u)=>Math.abs(u[0]-tx)<230&&Math.abs(u[1]-ty)<20))ty+=up?-20:20;used.push([tx,ty]);
      s+=`<line x1="${p[0]}" y1="${p[1]+(up?-16:16)}" x2="${tx}" y2="${ty+(up?6:-16)}" stroke="#ffd24a" opacity=".7"/><text x="${tx}" y="${ty}" text-anchor="middle" fill="#ffe9a6" font-size="15" font-weight="600" style="paint-order:stroke;stroke:#0f1b2d;stroke-width:6px;stroke-linejoin:round">Week ${t.w}: ${esc(t.short)} · ${t.d>0?'+':''}${Math.round(t.d*100)}</text>`})}

    if(br.g){const yw=Y(br.win[id].playoff),yl=Y(br.lose[id].playoff);let lw=yw,ll=yl;const gap=nr?44:50;if(ll-lw<gap){const m=(lw+ll)/2;lw=m-gap/2;ll=m+gap/2}if(lw<y0+12){ll+=y0+12-lw;lw=y0+12}if(ll>y1-14){lw-=ll-(y1-14);ll=y1-14}
      const cv=(y,c2,on,dim)=>`<path d="M${nx} ${ny}C${(nx+xf)/2} ${ny},${(nx+xf)/2} ${y},${xf} ${y}" fill="none" stroke="${c2}" stroke-width="${on?6:4}" opacity="${dim?.3:1}" stroke-linecap="round" ${on?'':'stroke-dasharray="1 9"'}/><circle cx="${xf}" cy="${y}" r="${on?8:6}" fill="${c2}" opacity="${dim?.3:1}"/>`;

      const mid=(lw+ll)/2+6;s+=`<rect class="hit" data-br="win" tabindex="0" role="button" aria-label="Test a win over ${M(br.opp)}" x="${nx+14}" y="0" width="${x1-nx-10}" height="${mid}"/><rect class="hit" data-br="lose" tabindex="0" role="button" aria-label="Test a loss to ${M(br.opp)}" x="${nx+14}" y="${mid}" width="${x1-nx-10}" height="${Hh-mid}"/>`}
    const cwid=(xm-x0)/weeks.length;weeks.forEach((w,i)=>{s+=`<rect class="hit" data-w="${w}" tabindex="0" role="button" aria-label="Week ${w}: ${pct(odds(id,i))}" x="${Math.max(X(i)-cwid/2,0)}" y="0" width="${cwid}" height="${Hh}"/>`});
    return s+'</svg>'}
  function drawA(){const id=S.me,f=T(id),br=branch(id),hist=S.wk?H.weeks[S.wk]:null,i=S.wk?weeks.indexOf(S.wk):-1,sm=scen[id],b=base[id],n=nF(),tp=turning(id),st=br.key&&S.forced[br.key]?(S.forced[br.key]===id?'win':'lose'):null;
    const p=hist?odds(id,i):sm.playoff,r=hist?res(id,S.wk):null,verdict=cp(id)==='certain'?'Clinched: this is arithmetic, not a simulation.':cp(id)==='impossible'?'Eliminated: the regular season is over.':p>=.995?'A lock by the model, though not yet mathematically clinched.':p>=.9?'In very good shape.':p>=.65?'Favored to get in.':p>=.35?'On the line.':p>=.1?'Needs help.':p>=.005?'A long shot.':'Did not get in during 8,000 simulated seasons, but not mathematically eliminated: the sixth seed is decided on points.';
    $('A').innerHTML=`<div class="q" style="margin-top:14px">${hist?`How did I get here? · after Week ${S.wk}`:n?'Under your scenario':'How likely am I to make the playoffs?'}</div>
     <div class="out">${emblem(th(id)).replace('<svg','<svg class="cr"')}<div><div class="nm" style="color:${th(id).hi}">${M(id)}<small>${esc(f.team_name)} · ${hist?`${hist.records[id].w}–${hist.records[id].l} after Week ${S.wk} · seed ${hist.seeds.indexOf(id)+1}`:`${esc(f.record)} · seed ${f.seed} · ${f.pf.toFixed(1)} points for (${ord(f.points_rank)})`}</small></div>
      <div class="bigp"><b class="n" id="bigp">${pct(p,cp(id))}</b><span>${hist?`chance to make the playoffs after Week ${S.wk}. ${r?`${r.result==='W'?'Beat':'Lost to'} ${M(r.opp)} ${f2(r.pf)}–${f2(r.pa)} that week.`:''}`:`chance to make the six-team playoff${n&&Math.round(p*100)!==Math.round(b.playoff*100)?`, <b style="color:${p>b.playoff?'#7fe0aa':'#ff9aa9'}">${p>b.playoff?'up':'down'} from ${pct(b.playoff)}</b>`:''}. ${verdict}`}</span></div></div></div>
     ${hist?'':`<div class="mini"><div><b>${pct(sm.top5)}</b><span>top-five seed (on record)</span></div><div><b>${pct(sm.sixth)}</b><span>sixth seed (on points)</span></div><div><b>${pct(sm.bye)}</b><span>first-round bye</span></div><div><b>${pct(sm.champ)}</b><span>wins the title</span></div></div>`}
