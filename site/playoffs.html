      <div><h3>Week ${c.playoff_week_start+1} · semifinals</h3>${slot(0,'bye')}<div class="vsx2">V</div>${tbd('Lowest seed still alive')}<div style="height:14px"></div>${slot(1,'bye')}<div class="vsx2">V</div>${tbd('The other first-round winner')}</div>
      <div><h3>Week ${c.playoff_week_start+2} · championship</h3>${(()=>{const ch=[...ids].sort((x,y)=>scen[y].champ-scen[x].champ);return `<div class="slot" style="grid-template-columns:52px 1fr auto">${emblem(th(ch[0])).replace('<svg','<svg style="width:48px;height:48px"')}<span><small>Most likely champion</small><br><b style="font-family:'Bebas Neue';font-weight:400;font-size:30px;color:${th(ch[0]).hi}">${M(ch[0])}</b></span><b style="font-family:'Bebas Neue';font-weight:400;font-size:30px">${pct(scen[ch[0]].champ)}</b></div>${ch[0]!==id?`<div class="slot me" style="margin-top:10px">${emblem(th(id))}<span><b style="font-weight:600">${M(id)}</b></span><small>title ${pct(scen[id].champ)}</small></div>`:''}`})()}</div></div>
     <p class="sm" style="margin-top:14px">${esc(L.rules.bracket)} ${esc(L.rules.bracket_flag)}</p>`}
  // ---- F: details ----
  function drawF(){const order=ids.map(T),n=nF(),yr=Math.min(...c.franchises.flatMap((f)=>f.future_picks.map((p)=>p.season))),owner={};for(const f of c.franchises)for(const p of f.future_picks)if(p.season===yr&&p.round===1)owner[p.original_roster]=f.roster_id;
    const nonp=[...order].sort((x,y)=>scen[y.roster_id].miss-scen[x.roster_id].miss||y.seed-x.seed),fl=(f)=>`<a href="franchise.html?f=${f.slug}">${esc(f.manager)}</a>`;
    const F=(k,t,sub,inner)=>`<details class="fd" data-f="${k}" id="${k}" ${open.has(k)?'open':''}><summary>${t}<small>${sub}</small></summary>${inner}</details>`;
    $('F').innerHTML=`<div class="q">The details</div><h2>Numbers, rules and method</h2>
     ${F('certain','What is mathematically certain this week','exact, not simulated',`<div class="tw2"><table>${order.map((f)=>{const t=topFiveNote(tw,f.roster_id);return t?`<tr class="${f.roster_id===S.me?'me':''}"><td>${fl(f)}</td><td>${esc(t)}</td></tr>`:''}).join('')||'<tr><td>Nothing can be clinched or lost this week.</td></tr>'}</table></div><p class="sm">Checked against every combination of this week's ${games.length} results. Deliberately cautious: it may confirm a clinch a week late, never early. The sixth seed is decided on points, so no franchise is mathematically out of it before Week ${L.regular_season_end} ends.</p>`)}
     ${F('table','All the numbers',n?'under your scenario':'as things stand',`<div class="tw2"><table><tr><th>Seed</th><th>Franchise</th><th class="num">Record</th><th class="num">PF</th><th class="num">Proj. wins</th><th class="num">Playoffs</th><th class="num">Top five</th><th class="num">Sixth</th><th class="num">Bye</th><th class="num">Title</th><th class="num">Likeliest seed</th></tr>${order.map((f)=>{const s=scen[f.roster_id];return `<tr class="${f.roster_id===S.me?'me':''}"><td>${f.seed}</td><td>${fl(f)}</td><td class="num">${esc(f.record)}</td><td class="num">${f.pf.toFixed(1)}</td><td class="num">${s.wins.toFixed(1)}</td><td class="num"><b>${pct(s.playoff)}</b></td><td class="num">${pct(s.top5)}</td><td class="num">${pct(s.sixth)}</td><td class="num">${pct(s.bye)}</td><td class="num">${pct(s.champ)}</td><td class="num">${ord(likeSeed(s))}</td></tr>`}).join('')}</table></div>`)}
     ${F('draft',yr+' rookie draft order','projected · rule from the Playbook',`<div class="tw2"><table><tr><th>Own first-round pick</th><th class="num">If the season ended today</th><th class="num">Top-six pick</th><th class="num">Most likely</th><th>Who holds it</th></tr>${nonp.map((f)=>{const s=scen[f.roster_id],top=s.slot.indexOf(Math.max(...s.slot)),now=f.seed>NP?12-f.seed+1:null,o=owner[f.roster_id];return `<tr class="${f.roster_id===S.me?'me':''}"><td>${fl(f)}</td><td class="num">${now?'1.'+String(now).padStart(2,'0'):'7–12'}</td><td class="num">${pct(s.miss)}</td><td class="num">${s.miss<.03?'—':'1.'+String(top+1).padStart(2,'0')+' ('+pct(s.slot[top])+')'}</td><td>${o===f.roster_id?'Own pick':o?'Held by '+esc(T(o).manager):'—'}</td></tr>`}).join('')}</table></div><p class="sm">${esc(L.rules.draft)}</p><div class="flag2"><b>Provisional.</b> ${esc(L.rules.draft_flag)}</div>`)}
     ${F('method','How the numbers are made','model and assumptions',`<p>${esc(L.rules.model)}</p><p>${esc(L.rules.seeding)} ${esc(L.rules.bracket)} Title odds use the same model for single playoff games.</p><p class="sm">The same scenario always returns the same numbers: the simulation uses a fixed random seed per scenario. Three kinds of statement appear on this page and are labelled: <b>exact</b> (arithmetic that holds whatever the scores), <b>simulated</b> (probabilities from the model) and <b>provisional</b> (draft slots, which are only final when the season ends).</p>`)}
     ${F('status','Data status','live, final, historical',`<p><b>Live / provisional:</b> a week in progress. Its scores are shown on the Matchups page and are never counted in records or odds here.</p><p><b>Final, open to corrections:</b> the most recent completed week (Week ${L.through_week}). It counts once Sleeper has moved on to the next week, and its snapshot is recalculated at every refresh until the following week is complete, so NFL stat corrections flow through.</p><p><b>Final, locked:</b> every earlier week. Its saved snapshot is never recalculated.</p><p><b>Historical:</b> ${weeks.filter((w)=>H.weeks[w].source==='reconstructed').length} weeks are reconstructed (calculated afterwards from results through that week); later weeks are recorded as they finish.</p><p class="sm">${esc(stamp(c))} Data refreshes every six hours; if a refresh fails, the site keeps the last good data.</p>`)}`;
    if(location.hash==='#draft'){const d=$('draft');d.open=true}}
  const open=new Set(location.hash==='#draft'?['draft']:[]),keep=()=>document.querySelectorAll('details[data-f]').forEach((d)=>d.open?open.add(d.dataset.f):open.delete(d.dataset.f));
  function tags(){$('tags').innerHTML=`<span>NYC Dynasty League · ${c.season}</span>${c.week_in_progress?`<span class="tg live">Week ${cw} live</span>`:''}<span class="tg fin">Final through Week ${L.through_week}</span><span class="tg sim">Odds simulated</span><span>Updated ${new Date(c.generated_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>`}
  function pk(){const el=$('pk');el.innerHTML=ids.map((id)=>`<button data-id="${id}" aria-pressed="${id===S.me}">${emblem(th(id))}${M(id)}</button>`).join('');el.querySelectorAll('button').forEach((b)=>b.onclick=()=>select(+b.dataset.id));const on=el.querySelector('[aria-pressed=true]');if(on&&el.scrollWidth>el.clientWidth)el.scrollLeft=on.offsetLeft-el.clientWidth/2+on.clientWidth/2}
  function select(id){keep();S.me=id;myTeam.set(T(id).slug);history.replaceState(null,'',`playoffs.html?f=${T(id).slug}${location.hash}`);draw()}
  function draw(){keep();scen=nF()?simulate(c,L,S.forced):base;setState();tags();pk();drawA();drawB();drawC();drawD();drawE();drawF()}
  draw();if(location.hash==='#draft')$('draft').scrollIntoView();let wn=narrow();let rw=innerWidth;addEventListener('resize',()=>{if(narrow()!==wn||(narrow()&&Math.abs(innerWidth-rw)>20)){wn=narrow();rw=innerWidth;drawA()}});addEventListener('hashchange',()=>{if(location.hash==='#draft'){const d=$('draft');d.open=true;d.scrollIntoView()}});
  $('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('A').innerHTML='<p style="color:#fff">League data could not be loaded. Try again in a minute.</p>'});
</script></body></html>
