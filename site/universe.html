<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>The Race — NYC Dynasty League</title><link rel="stylesheet" href="assets/app.css">
<style>.fc{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.fc button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border:1px solid #2c2f38;font-size:16px;white-space:nowrap;min-height:42px}@media(max-width:860px){.fc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;margin-right:-16px}.fc button{flex:0 0 auto}}.fc button svg{width:26px;height:26px}.fc button[aria-pressed=true]{border-color:var(--c);background:rgba(var(--g),.16);color:var(--c)}.fc button:focus-visible{outline:2px solid #fff}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}.chart text{font-family:'Barlow Condensed',sans-serif;fill:#8d909b;font-size:15px}.chart .ln{fill:none;stroke-linejoin:round;stroke-linecap:round;transition:opacity .25s,stroke-width .25s}.chart .pt{cursor:pointer;transition:opacity .25s}.chart .hit,.chart .col{fill:transparent;cursor:pointer}
.cg{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:980px){.cg{grid-template-columns:1fr}}
.side .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 6px;font-size:17px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer}.side .row[aria-current=true]{background:rgba(255,255,255,.07)}.side .row span{font-variant-numeric:tabular-nums}.side .d{font-size:14px;min-width:38px;text-align:right}
input[type=range]{width:100%;accent-color:#e8e6e1}.gt{border-collapse:separate;border-spacing:3px;width:100%}.gt th{font-size:13px}.gl{display:grid;gap:10px}.gl>div{border:1px solid var(--line);padding:10px}.gl h4{margin:0 0 8px;font-size:18px;font-weight:600;display:flex;justify-content:space-between}.gl .cs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}.gl .cs a{padding:7px 4px;text-decoration:none;color:#fff;font-size:14px;line-height:1.15;text-align:center;overflow:hidden}.gl .cs small{display:block;font-size:12px;opacity:.9}.gt td{padding:0;border:0}.gt .cell{display:block;padding:8px 8px;text-decoration:none;font-size:15px;line-height:1.1;color:#fff;min-width:86px}.gt .cell small{display:block;font-size:12px;opacity:.85}.gt tr.dim td .cell,.gt tr.dim th{opacity:.35}.gt th.t{text-align:left;font-size:15px;letter-spacing:0;text-transform:none;color:var(--txt);white-space:nowrap;cursor:pointer;padding:0 8px 0 0}
.story{border-left:3px solid #e8e6e1;padding:8px 14px;margin:12px 0;font-size:18px;max-width:none}</style></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:24px;padding-bottom:50px"><div class="k">Playoff war room</div><h1 class="h-page">The race so far</h1><div id="sn"></div>
<p class="lede">How every franchise's chance of making the six has moved. <b>1.</b> Pick a franchise. <b>2.</b> Pick a week. Every chart follows.</p>
<div class="fc" id="fc" role="group" aria-label="Franchise"></div>
<p style="display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;max-width:640px"><button class="btn" id="pw" aria-label="Previous week">◀</button><input type="range" id="wk" min="1" step="1" aria-label="Week"><button class="btn" id="nw" aria-label="Next week">▶</button></p><p class="k" id="wkl" style="color:#fff;font-size:18px;margin:-6px 0 0"></p>
<div id="page"></div><footer id="foot"></footer></div>
<script src="assets/app.js"></script><script>
document.getElementById('nav').innerHTML=nav('Playoffs');
loadLive().then(([c,L,WK,H])=>{
  const T=(id)=>c.byRoster[id],th=(id)=>c.themes[T(id).theme],ids=c.standings,weeks=Object.keys(H.weeks).map(Number).sort((a,b)=>a-b),W=weeks[weeks.length-1];
  const q=new URLSearchParams(location.search);document.getElementById('sn').innerHTML=subnav('The race so far');const narrow=()=>innerWidth<860;let wasNarrow=narrow();let sel=(c.franchises.find((f)=>f.slug===(q.get('f')||myTeam.get()))||{}).roster_id||null,wk=weeks.includes(+q.get('w'))?+q.get('w'):W;
  const rg=document.getElementById('wk');rg.max=W;rg.value=wk;
  document.getElementById('fc').innerHTML=ids.map((id)=>`<button data-id="${id}" aria-pressed="false" style="--c:${th(id).hi};--g:${th(id).flash}">${emblem(th(id))}${esc(T(id).manager)}</button>`).join('');
  const X=(w,x0,x1)=>x0+(weeks.length>1?(w-weeks[0])/(W-weeks[0]):.5)*(x1-x0);
  function lines(vals,yf,opts){ // vals: id -> [value per week]
    const nr=narrow(),lab=opts.labels&&!nr,Wd=nr?Math.max(360,Math.min(innerWidth-32,600)):1000,Hh=nr?Math.round(opts.h*.72):opts.h,x0=nr?38:46,x1=Wd-(lab?170:12),y0=22,y1=Hh-34;let s=`<svg class="chart" viewBox="0 0 ${Wd} ${Hh}" role="img" aria-label="${opts.label}">`;
    for(const t of opts.ticks)s+=`<line x1="${x0}" x2="${x1}" y1="${yf(t.v,y0,y1)}" y2="${yf(t.v,y0,y1)}" stroke="#20232b"/><text x="${x0-8}" y="${yf(t.v,y0,y1)+5}" text-anchor="end">${t.l}</text>`;
    for(const w of weeks)s+=`<text x="${X(w,x0,x1)}" y="${Hh-10}" text-anchor="middle" ${w===wk?'style="fill:#fff;font-weight:600"':''}>${nr?w:'W'+w}</text>`;
    s+=`<line x1="${X(wk,x0,x1)}" x2="${X(wk,x0,x1)}" y1="${y0}" y2="${y1}" stroke="#e8e6e1" stroke-dasharray="4 5" opacity=".6"/>`;
    const ly={};if(lab){const e=ids.map((id)=>({id,y:yf(vals[id][weeks.length-1],y0,y1)})).sort((p,q)=>p.y-q.y);for(let k=1;k<e.length;k++)if(e[k].y-e[k-1].y<20)e[k].y=e[k-1].y+20;const over=e[e.length-1].y-(Hh-22);if(over>0)for(let k=e.length-1;k>=0;k--){e[k].y-=over;if(k&&e[k].y-e[k-1].y>=20)break}for(let k=e.length-2;k>=0;k--)if(e[k+1].y-e[k].y<20)e[k].y=e[k+1].y-20;for(const x of e)ly[x.id]=x.y}
    const order=[...ids].sort((a,b)=>(a===sel)-(b===sel));
    for(const id of order){const on=sel===null||sel===id,col=th(id).hi,pts=weeks.map((w,i)=>[X(w,x0,x1),yf(vals[id][i],y0,y1)]);
      s+=`<path class="ln" d="M${pts.map((p)=>p.map((v)=>v.toFixed(1)).join(' ')).join('L')}" stroke="${col}" stroke-width="${sel===id?(nr?4:5):(nr?1.6:2.2)}" opacity="${on?1:.16}"/>`;
      pts.forEach((p,i)=>{const mk=opts.marks&&opts.marks[weeks[i]]===id;s+=`<circle class="pt" data-id="${id}" data-w="${weeks[i]}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${nr?(sel===id?4.5:mk?4.5:2.2):(sel===id?6:mk?6:3.4)}" fill="${mk&&sel!==id?'#07080b':col}" stroke="${col}" stroke-width="${mk?3:0}" opacity="${on||mk?1:.16}"><title>${esc(T(id).manager)}, Week ${weeks[i]}: ${opts.fmt(vals[id][i])}</title></circle>${nr?'':`<circle class="hit" data-id="${id}" data-w="${weeks[i]}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="13"/>`}`});
      if(lab){const y=ly[id],ly0=pts[pts.length-1];s+=`<line x1="${ly0[0]+6}" y1="${ly0[1]}" x2="${x1+8}" y2="${y}" stroke="${col}" opacity="${on?.5:.12}"/><g class="pt" data-id="${id}" data-w="${wk}" opacity="${on?1:.3}"><svg x="${x1+10}" y="${y-9}" width="18" height="18" viewBox="0 0 200 200">${emblem(th(id)).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><text x="${x1+33}" y="${y+5}" style="fill:${col};font-size:${sel===id?18:15}px;font-weight:${sel===id?600:400}">${esc(T(id).manager)} · ${opts.fmt(vals[id][weeks.length-1])}</text></g>`}}
    if(nr){const cw=(x1-x0)/Math.max(1,weeks.length-1);for(const w of weeks)s+=`<rect class="col" data-w="${w}" x="${X(w,x0,x1)-cw/2}" y="0" width="${cw}" height="${Hh}"><title>Week ${w}</title></rect>`}
    return s+'</svg>'}
  const odds=Object.fromEntries(ids.map((id)=>[id,weeks.map((w)=>H.weeks[w].odds[id].playoff)])),rank=Object.fromEntries(ids.map((id)=>[id,weeks.map((w)=>H.weeks[w].power.indexOf(id)+1)]));
  const marks={};weeks.forEach((w,i)=>{if(!i)return;let b=null;for(const id of ids){const d=Math.abs(odds[id][i]-odds[id][i-1]);if(d>=.15&&(!b||d>b.d))b={id,d}}if(b)marks[w]=b.id});
  const game=(id,w)=>{const r=T(id).results.find((x)=>x.week===w);return r?`${r.result==='W'?'beat':'lost to'} ${T(r.opp).manager} ${r.pf.toFixed(2)}–${r.pa.toFixed(2)}`:''};
  function draw(){rg.value=wk;document.getElementById('wkl').textContent=`After Week ${wk}${sel?' · following '+T(sel).manager:' · all twelve'}`;myTeam.set(sel?T(sel).slug:null);history.replaceState(null,'',`universe.html?w=${wk}${sel?'&f='+T(sel).slug:''}`);
    document.querySelectorAll('#fc button').forEach((b)=>b.setAttribute('aria-pressed',String(+b.dataset.id===sel)));
    const i=weeks.indexOf(wk),hw=H.weeks[wk],byOdds=[...ids].sort((a,b)=>odds[b][i]-odds[a][i]||hw.seeds.indexOf(a)-hw.seeds.indexOf(b));
    const focus=sel||marks[wk]||null,story=focus?`<p class="story" style="border-color:${th(focus).hi}"><b style="color:${th(focus).hi}">${esc(T(focus).manager)}, Week ${wk}:</b> ${game(focus,wk)}. Playoff chance ${i?pct(odds[focus][i-1])+' → ':''}${pct(odds[focus][i])}; power ranking ${i?ord(rank[focus][i-1])+' → ':''}${ord(rank[focus][i])}; record ${hw.records[focus].w}–${hw.records[focus].l}. <a href="week.html?w=${wk}">Week ${wk} recap →</a></p>`:'';
    const gw=Object.keys(L.schedule).map(Number),ppgs=ids.map((id)=>L.teams[id].ppg),mn=Math.min(...ppgs),mx=Math.max(...ppgs),heat=(v)=>{const t=(v-mn)/(mx-mn);return `hsl(${Math.round(150-150*t)} ${55+t*20}% ${22+t*14}%)`};
    document.getElementById('page').innerHTML=`
<section class="blk"><h3>Playoff chance, week by week</h3><p class="note" style="margin-top:-6px">The percentage is how often a franchise makes the six-team playoff when the rest of the season is simulated 8,000 times from that week.</p>${story}<div class="cg"><div>${lines(odds,(v,y0,y1)=>y1-v*(y1-y0),{h:460,label:'Playoff chance by week',labels:true,marks,fmt:(v)=>pct(v),ticks:[0,.25,.5,.75,1].map((v)=>({v,l:Math.round(v*100)+'%'}))})}
  <p class="note">Hollow rings mark the biggest swing of each week. ${narrow()?'Tap anywhere on the chart to jump to that week; pick a franchise from the list.':'Click any point for the game behind it.'} ${weeks.filter((w)=>H.weeks[w].source==='reconstructed').length?`Weeks ${weeks.filter((w)=>H.weeks[w].source==='reconstructed')[0]}–${weeks.filter((w)=>H.weeks[w].source==='reconstructed').pop()} are reconstructed: calculated afterwards with today's model from results through each week, not predictions published at the time. Later weeks are recorded as each week ends and never recalculated.`:'Every week shown was recorded when it ended.'} </p><p><button class="btn" data-save="0">Save chart as image</button></p></div>
  <div class="side"><div class="k" style="margin-bottom:6px">After Week ${wk}</div>${byOdds.map((id)=>{const d=i?odds[id][i]-odds[id][i-1]:0;return `<div class="row" data-id="${id}" aria-current="${id===sel}"><b style="color:${th(id).hi};font-weight:${id===sel?600:400}">${hw.seeds.indexOf(id)+1}. ${esc(T(id).manager)} <span class="note">${hw.records[id].w}–${hw.records[id].l}</span></b><span>${pct(odds[id][i])}</span><span class="d" style="color:${d>.005?'#6fe39b':d<-.005?'#ff8b7a':'#666'}">${Math.abs(d)<.005?'–':(d>0?'+':'')+Math.round(d*100)}</span></div>`}).join('')}</div></div></section>
<section class="blk"><h3>Power rankings, week by week</h3>${lines(rank,(v,y0,y1)=>y0+(v-1)/11*(y1-y0),{h:440,label:'Power ranking by week',labels:true,fmt:(v)=>ord(v),ticks:[1,3,6,9,12].map((v)=>({v,l:String(v)}))})}
  <p class="note">An editorial ranking, not the standings: 40% record against every team every week, 35% scoring average, 25% last three weeks, using only results through each week. </p><p><button class="btn" data-save="1">Save chart as image</button></p></section>
<section class="blk"><h3>The schedule gauntlet</h3><p class="note" style="margin-top:-6px">Who each franchise still has to play, hardest path first. Colour shows how many points that opponent scores in an average week.</p><div class="legend"><span>Lower-scoring opponent</span><i></i><span>Higher-scoring opponent</span></div>
  ${(()=>{const srt=[...ids].sort((a,b)=>(L.teams[b].sos||0)-(L.teams[a].sos||0)),cell=(id,w,cls)=>{const o=L.teams[id].remaining.find((r)=>r.week===w),b=L.teams[id].byes?.[w]?.length||0;return o?`<a class="${cls}" style="background:${heat(L.teams[o.opp].ppg)}" href="rivalry.html?a=${T(id).slug}&b=${T(o.opp).slug}" title="${esc(T(o.opp).team_name)} average ${L.teams[o.opp].ppg} a week">${narrow()?'<small>WK '+w+'</small>':''}${esc(T(o.opp).manager)}<small>${L.teams[o.opp].ppg}${narrow()?'':' avg'}${b?` · ${b} bye`:''}</small></a>`:''};
   return narrow()?`<div class="gl">${(sel?[sel,...srt.filter((x)=>x!==sel)]:srt).map((id)=>`<div><h4 style="color:${th(id).hi}"><span>${esc(T(id).manager)} <span class="note">${esc(T(id).record)}</span></span><span class="note">opp. avg ${L.teams[id].sos??'—'}</span></h4><div class="cs">${gw.map((w)=>cell(id,w,'')).join('')}</div></div>`).join('')}</div>`
   :`<div class="tw"><table class="gt"><tr><th></th><th class="num">Opp. avg</th>${gw.map((w)=>`<th>Week ${w}${w===c.current_week&&c.week_in_progress?' · live':''}</th>`).join('')}</tr>${srt.map((id)=>`<tr class="${sel&&sel!==id?'dim':''}"><th class="t" data-id="${id}" style="color:${th(id).hi}">${esc(T(id).manager)} <span class="note">${esc(T(id).record)}</span></th><td class="num" style="padding:0 8px;font-variant-numeric:tabular-nums">${L.teams[id].sos??'—'}</td>${gw.map((w)=>`<td>${cell(id,w,'cell')}</td>`).join('')}</tr>`).join('')}</table></div>`})()}
  <p class="note">"Bye" counts that franchise's Week ${L.through_week} starters whose NFL team is off that week. This describes the schedule; it is not lineup advice. Tap a cell for the rivalry file.</p></section>`;
    document.querySelectorAll('.hit,.pt').forEach((p)=>p.onclick=()=>{sel=+p.dataset.id;wk=+p.dataset.w;draw()});document.querySelectorAll('.col').forEach((p)=>p.onclick=()=>{wk=+p.dataset.w;draw()});document.querySelectorAll('.side .row,.gt th.t').forEach((r)=>r.onclick=()=>{sel=sel===+r.dataset.id?null:+r.dataset.id;draw()});
    document.querySelectorAll('[data-save]').forEach((b)=>b.onclick=()=>{const svg=document.querySelectorAll('svg.chart')[+b.dataset.save].cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.querySelectorAll('.hit,.col,title').forEach((e)=>e.remove());const st=document.createElementNS('http://www.w3.org/2000/svg','style');st.textContent="text{font-family:Arial,sans-serif;fill:#8d909b;font-size:14px}.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}";svg.prepend(st);
      const vb=svg.viewBox.baseVal,img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=vb.width*2;cv.height=vb.height*2+90;const x=cv.getContext('2d');x.fillStyle='#07080b';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#e8e6e1';x.font='600 34px Arial';x.fillText(`NYC Dynasty League · ${+b.dataset.save?'Power rankings':'Playoff chance'} through Week ${W}`,40,58);x.drawImage(img,0,90,cv.width,vb.height*2);savePng(cv,+b.dataset.save?'power-rankings.png':'playoff-race.png')};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg))})}
  document.getElementById('fc').onclick=(e)=>{const b=e.target.closest('button');if(!b)return;sel=sel===+b.dataset.id?null:+b.dataset.id;draw()};rg.oninput=()=>{wk=+rg.value;draw()};document.getElementById('pw').onclick=()=>{const i=weeks.indexOf(wk);if(i>0){wk=weeks[i-1];draw()}};document.getElementById('nw').onclick=()=>{const i=weeks.indexOf(wk);if(i<weeks.length-1){wk=weeks[i+1];draw()}};addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();draw()}});
  draw();document.getElementById('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
