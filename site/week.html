    page.onkeydown=(e)=>{const t=e.target.closest&&e.target.closest('[role=tab]');if(!t||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...t.parentElement.children],k=tabs.indexOf(t),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(k+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();tabs[n].click()};
    // new Sleeper totals arrived (app.js has already laid them over the data): update numbers in place, never reload, never scroll
    window.onLiveScores=GDON?()=>anchored(()=>{if(!document.getElementById('fol'))return;const fi=followI();pv.games.forEach((g,i)=>{const was=last[i],now=vals(i),moved=Object.keys(now).some((k)=>Math.abs(now[k]-was[k])>.004);
        const mid=document.getElementById('mid'+i),lvE=document.getElementById('lv'+i);if(mid)mid.innerHTML=midHTML(g);if(lvE)lvE.innerHTML=lv(g);
        const box=document.getElementById('gd'+i);if(box){if(GD[i]&&GD[i].tab==='lineups'&&moved&&document.getElementById('m'+i).open){GD[i].pending=true;const top=box.querySelector('.gd-top'),tmp=document.createElement('div');tmp.innerHTML=gameDayHTML(g,i,GX());top.replaceWith(tmp.querySelector('.gd-top'));box.querySelector('.gd-lead').replaceWith(tmp.querySelector('.gd-lead'));if(!box.querySelector('.gd-pend')){const p=document.createElement('p');p.className='gd-pend';p.setAttribute('role','status');p.innerHTML=`<span>New scores arrived while you were reading this table.</span><button class="b2 on" data-gdapply="${i}">Update the table</button>`;box.querySelector('.gd-body').prepend(p)}flash(box,i,was)}else redraw(i,was)}
        if(i===fi&&moved){document.getElementById('fol').innerHTML=followHTML();flash(document.getElementById('fol'),i,was);document.getElementById('gdlive').textContent=`Scores updated. ${M(g.a)} ${f2(now.sa)}, ${M(g.b)} ${f2(now.sb)}.`}last[i]=now})}):null;
    let _tw=tlW();window.onresize=()=>{if(Math.abs(tlW()-_tw)>24){_tw=tlW();pv.games.forEach((g,i)=>{const box=document.getElementById('tl'+i);if(box)box.innerHTML=timelineHTML(g,box.dataset.sel===''?null:+box.dataset.sel,T(g.a),T(g.b),_tw)})}};
    if(/^#[\w-]+$/.test(location.hash))document.querySelector(location.hash)?.scrollIntoView()}
  function later(){document.getElementById('kind').textContent='NYC Dynasty · Coming up';document.getElementById('h').textContent=`Week ${w}`;document.getElementById('sub').textContent='Scheduled games · full preview appears when the week begins';
    page.innerHTML=(L.schedule[w]||[]).map(([a,b])=>{const p=winChance(L,a,b);return `<div class="mrow"><div class="l"><div class="who">${up(T(a).manager)}</div><small>${esc(T(a).team_name)} · ${esc(T(a).record)}</small></div><div class="mid"><div class="pp"><i>${Math.round(p*100)}%</i> <b>${100-Math.round(p*100)}%</b></div><div class="wbar"><i style="width:${(p*100).toFixed(1)}%"></i></div><small>model estimate</small></div><div class="r"><div class="who">${up(T(b).manager)}</div><small>${esc(T(b).team_name)} · ${esc(T(b).record)}</small></div></div>`}).join('')||'<p class="note">Schedule not available yet.</p>'}
  function recap(){const d=L.weeks[w],a=WK.awards[w],hs=H.weeks[w];document.getElementById('kind').textContent='NYC Dynasty · The Fallout';document.getElementById('h').textContent=`Week ${w} Recap`;document.title=`Week ${w} recap — NYC Dynasty League`;
    document.getElementById('sub').textContent=`${c.season} · final results`;
    page.innerHTML=`<h3 class="sec">The awards<small>${a.list?a.list.length+' awards for players and position groups, ':''}calculated from results, not voted</small></h3><div class="aw aw-all">
      ${a.list?a.list.map((x)=>awardItem(x,M)).join(''):`${a.main_character?awardCard('main_character','THE MAIN CHARACTER',esc(a.main_character.name),`${f2(a.main_character.points)} for ${M(a.main_character.roster_id)} in a game decided by ${f2(a.main_character.margin)}${a.main_character.decisive?': without him, it is a loss.':'.'}`):''}
      ${a.heartbreaker?awardCard('heartbreaker','THE HEARTBREAKER',M(a.heartbreaker.roster_id),`Scored ${f2(a.heartbreaker.points)}, the highest total by a losing team this week, and lost to ${M(a.heartbreaker.opp)}'s ${f2(a.heartbreaker.opp_points)}.`):''}
      ${a.chaos?awardCard('chaos','THE CHAOS AWARD',M(a.chaos.winner),`Beat ${M(a.chaos.loser)} ${f2(a.chaos.winner_pts)}–${f2(a.chaos.loser_pts)} after going in with a ${Math.round(a.chaos.win_prob*100)}% chance to win on the site's model.`):awardCard('chaos','THE CHAOS AWARD','No upset',w===1?'No scoring averages existed before Week 1.':'Every winner was the higher-scoring team coming in.')}
      ${a.steamroller?awardCard('steamroller','THE STEAMROLLER',M(a.steamroller.roster_id),`Won by ${f2(a.steamroller.margin)}, ${f2(a.steamroller.points)}–${f2(a.steamroller.opp_points)} over ${M(a.steamroller.opp)}: the widest margin of the week.`):''}
      ${a.menace?awardCard('menace','THE DEFENSIVE MENACE',esc(a.menace.name),`${f2(a.menace.points)} from the ${esc(a.menace.position)} spot for ${M(a.menace.roster_id)}.`):''}
      ${a.collapse?awardCard('collapse','THE COLLAPSE',M(a.collapse.roster_id),`Scored ${f2(a.collapse.points)} against a season average of ${a.collapse.average_before} coming in: ${a.collapse.short} points short.`):''}
      ${hs?awardCard('juggernaut','THE JUGGERNAUT',M(hs.power[0]),`Top of the power rankings after Week ${w}, at ${hs.records[hs.power[0]].w}–${hs.records[hs.power[0]].l}.`):''}`}</div>
     ${LIB&&LIB.weeks.some((x)=>x.week===w)?`<p style="margin-top:14px"><a class="btn" href="archives.html#library">The original Week ${w} preview pages</a></p>`:''}<h3 class="sec" style="margin-top:36px">Results<small>final scores</small></h3><div class="resg">${d.games.map((g)=>{const aw=g.pa>g.pb,wi=aw?g.a:g.b,lo=aw?g.b:g.a,ws=Math.max(g.pa,g.pb),ls=Math.min(g.pa,g.pb);return `<div class="res"><a class="rw w" href="franchise.html?f=${T(wi).slug}">${emblem(c.themes[T(wi).theme])}<span><b>${up(T(wi).manager)}</b><small>${esc(T(wi).team_name)}</small></span><i>${f2(ws)}</i></a><a class="rw l" href="franchise.html?f=${T(lo).slug}">${emblem(c.themes[T(lo).theme])}<span><b>${up(T(lo).manager)}</b><small>${esc(T(lo).team_name)}</small></span><i>${f2(ls)}</i></a><div class="rf"><span>Won by ${f2(ws-ls)}</span><a href="rivalry.html?a=${T(g.a).slug}&b=${T(g.b).slug}">Series history →</a></div></div>`}).join('')}</div>
     ${hs?`<div class="two" style="margin-top:22px"><section><h3 class="sh">Standings after Week ${w}<small>AS OF THEN</small></h3>${hs.seeds.map((id,i)=>`${i===c.playoff_teams?'<div class="cutline"><span>PLAYOFF LINE</span></div>':''}<div class="odds" style="--c:var(--bl)"><a href="franchise.html?f=${esc(T(id).slug)}">${i+1}. ${M(id)} <span class="note">${hs.records[id].w}–${hs.records[id].l} · ${hs.records[id].pf.toFixed(1)}</span></a><span class="p">${pct(hs.odds[id].playoff)}</span><span class="bar"><i style="width:${hs.odds[id].playoff*100}%"></i></span></div>`).join('')}
       <p class="note">Playoff chance after this week. ${hs.source==='recorded'?'Recorded when the week finished.':'Reconstructed afterwards with the current model from results through this week; it is not a prediction that was published at the time.'}</p></section>
      <section><h3 class="sh">Power rankings after Week ${w}</h3><ol class="pr">${hs.power.map((id,i)=>{const pr=H.weeks[w-1]?H.weeks[w-1].power.indexOf(id)+1:i+1,dd=pr-(i+1);return `<li><span>${i+1}</span><span class="mv ${dd>0?'up':dd<0?'dn':''}">${dd>0?'▲'+dd:dd<0?'▼'+(-dd):'–'}</span><a href="franchise.html?f=${esc(T(id).slug)}">${M(id)} · ${esc(T(id).team_name)}</a><span></span></li>`}).join('')}</ol></section></div>`:''}`}
  function draw(){history.replaceState(null,'',`week.html?w=${w}${location.hash}`);
    document.getElementById('tabs').innerHTML=`<a href="week.html?w=${L.through_week}" ${w===L.through_week?'aria-current="page"':''}>The Fallout · Wk ${L.through_week}</a>${pv.games.length?`<a href="week.html?w=${pv.week}" ${w===pv.week?'aria-current="page"':''}>The Hype Show · Wk ${pv.week}</a>`:''}<a href="playoffs.html">The Stakes</a>
      <select class="sel" id="w" aria-label="Go to week" style="margin-left:auto">${all.map((k)=>`<option value="${k}" ${k===w?'selected':''}>Week ${k} · ${k<=L.through_week?'recap':k===pv.week?'preview':'schedule'}</option>`).join('')}</select>`;
    document.getElementById('w').onchange=(e)=>{w=+e.target.value;location.hash='';draw()};
    w<=L.through_week?recap():w===pv.week&&pv.games.length?preview():later();window.scrollTo(0,0)}
  document.getElementById('tabs').addEventListener('click',(e)=>{const a=e.target.closest('a[href^="week.html"]');if(a){e.preventDefault();w=+new URL(a.href).searchParams.get('w');location.hash='';draw()}});
  draw();addEventListener('hashchange',()=>{const d=/^#m\d+$/.test(location.hash)&&document.querySelector(location.hash);if(d){d.open=true;d.scrollIntoView()}});document.getElementById('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
