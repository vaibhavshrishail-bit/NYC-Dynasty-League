  function poster(g){const cv=document.createElement('canvas');cv.width=1080;cv.height=1350;const x=cv.getContext('2d'),A=T(g.a),B=T(g.b);

    x.textAlign='left';x.fillStyle='#fff';x.font="400 34px 'Bebas Neue'";x.letterSpacing='8px';x.fillText('NYC DYNASTY',60,84);x.letterSpacing='0px';x.fillStyle='#4fd08a';x.font="400 34px 'Bebas Neue'";x.textAlign='right';x.fillText(`WEEK ${pv.week} · ${c.season}`,1020,84);
    x.textAlign='left';x.fillStyle='#fff';x.font="400 110px 'Bebas Neue'";const t=`${A.manager.toUpperCase()}  VS  ${B.manager.toUpperCase()}`;let z=110;while(x.measureText(t).width>960&&z>50){z-=4;x.font=`400 ${z}px 'Bebas Neue'`}x.fillText(t,60,186);
    x.textAlign='center';x.font="400 46px 'Bebas Neue'";g.headline.forEach((s,i)=>{let zz=46;x.font=`400 ${zz}px 'Bebas Neue'`;while(x.measureText(s).width>980&&zz>24){zz-=2;x.font=`400 ${zz}px 'Bebas Neue'`}x.fillText(s,540,290+i*52)});
    [...g.featured_a,...g.featured_b].forEach((p,i)=>{const cx=100+i*164+(i>2?40:0),r=i>2;x.fillStyle=r?'#1c0e15':'#0d1820';x.fillRect(cx-80,390,160,290);x.fillStyle=r?'#ff3558':'#2ea8e6';x.fillRect(cx-80,390,160,6);jerseyCanvas(x,p,cx,500,.19);
      x.fillStyle=r?'#ff3558':'#2ea8e6';let zz=26;x.font=`400 ${zz}px 'Bebas Neue'`;const nm=p.name.toUpperCase();while(x.measureText(nm).width>150&&zz>14){zz-=1;x.font=`400 ${zz}px 'Bebas Neue'`}x.fillText(nm,cx,618);x.fillStyle='#9aa0aa';x.font="600 20px 'Barlow Condensed'";x.fillText(p.projected!=null?p.projected.toFixed(2):'',cx,650)});
    x.font="400 150px 'Bebas Neue'";x.fillStyle='#2ea8e6';x.textAlign='right';x.fillText(f2(g.projected[0]),500,860);x.fillStyle='#ff3558';x.textAlign='left';x.fillText(f2(g.projected[1]),580,860);x.fillStyle='#fff';x.textAlign='center';x.font="400 40px 'Bebas Neue'";x.fillText('VS',540,830);
    x.fillStyle='#ff3558';x.fillRect(200,890,680,8);x.fillStyle='#2ea8e6';x.fillRect(200,890,680*g.win[0],8);x.font="400 44px 'Bebas Neue'";x.fillStyle='#2ea8e6';x.textAlign='left';x.fillText(`${p1(g.win[0])}% WIN`,200,950);x.fillStyle='#ff3558';x.textAlign='right';x.fillText(`${p1(g.win[1])}% WIN`,880,950);
    x.font="600 30px 'Barlow Condensed'";x.fillStyle='#e8e6e1';x.textAlign='left';x.fillText(`${A.team_name} · ${A.record}`,60,1040);x.textAlign='right';x.fillText(`${B.team_name} · ${B.record}`,1020,1040);
    x.textAlign='center';x.fillStyle='#4fd08a';x.font="400 40px 'Bebas Neue'";x.fillText(g.series.games&&!g.series.first_for_managers?(g.series.a===g.series.b?`ALL-TIME SERIES LEVEL ${g.series.a}-${g.series.b}`:`${(g.series.a>g.series.b?A:B).manager.toUpperCase()} LEADS THE SERIES ${Math.max(g.series.a,g.series.b)}-${Math.min(g.series.a,g.series.b)}`):'FIRST MEETING BETWEEN THESE MANAGERS',540,1130);
    x.fillStyle='#e8e6e1';x.font="600 28px 'Barlow Condensed'";[g.why||g.how_a[0],g.why?'':g.how_b[0]].forEach((s,i)=>{let zz=28;x.font=`600 ${zz}px 'Barlow Condensed'`;while(x.measureText(s).width>980&&zz>18){zz-=1;x.font=`600 ${zz}px 'Barlow Condensed'`}x.fillText(s,540,1190+i*40)});
    x.fillStyle='#666a75';x.font="600 20px 'Barlow Condensed'";x.fillText('Projected points and modeled win chance · not lineup advice',540,1310);return cv}
  const tlW=()=>Math.min(document.getElementById('page').clientWidth,1180)-(innerWidth<700?(innerWidth<360?40:28):44);
  function preview(){document.getElementById('kind').textContent='NYC Dynasty · The Hype Show';document.getElementById('h').textContent=`Week ${w} Preview`;document.title=`Week ${w} preview — NYC Dynasty League`;
    const d0=pv.slate[0]?.date,d1=pv.slate[pv.slate.length-1]?.date,fd=(d)=>new Date(d+'T12:00:00Z').toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'});

    const det=pv.games.map((g,i)=>{const A=T(g.a),B=T(g.b),n=g.windows.length;
      const tile=(p,r)=>`<div class="jt ${r?'r':''}">${jerseySVG(p)}<b>${up(p.name)}</b><span>${nflBadge(p.nfl_team)} ${esc(p.position)}${p.projected!=null?' · '+f2(p.projected):''}</span></div>`;
      const lu=(l,r,id)=>`<div class="${r?'r':''}"><h4>${up(T(id).manager)}<small>${esc(T(id).team_name)}</small></h4>${l.map((p)=>`<div class="p"><span class="s">${esc(p.slot)}</span><span class="n">${p.empty?'':nflBadge(p.nfl_team)+' '}${esc(p.name)}${p.status?`<sup title="${esc(p.status)}">${esc(p.status[0])}</sup>`:''}</span><span class="o">${esc(p.opp)}</span><span class="v">${g.live&&p.live?`<b>${f2(p.live)}</b>`:p.projected!=null?f2(p.projected):'—'}</span></div>`).join('')}</div>`;
      return `<details class="mx" id="m${i}" ${i===openI?'open':''}><summary><div class="mrow"><div class="tags">${g.kicker?`<span class="chip o">${up(g.kicker)}</span>`:''}<span class="chip">${up(g.rating)}</span>${lv(g)}</div><div class="l"><div class="who">${up(A.manager)}</div><small>${esc(A.team_name)} · ${esc(A.record)}</small></div>
        <div class="mid"><div class="pp"><i>${f2(g.projected[0])}</i> <span style="font-size:.4em;color:var(--hi)">VS</span> <b>${f2(g.projected[1])}</b></div><div class="wbar"><i style="width:${p1(g.win[0])}%"></i></div><small>${p1(g.win[0])}% win · ${p1(g.win[1])}% win</small></div>
        <div class="r"><div class="who">${up(B.manager)}</div><small>${esc(B.team_name)} · ${esc(B.record)}</small><small>${ser(g)}</small></div>
        <div class="hl1">${esc(g.headline[0])}</div><div class="more">Tap for the full preview</div></div></summary>
       <div class="in"><div class="hl">${g.headline.map(esc).join('<br>')}</div>${g.why?`<p class="st" style="text-align:center;margin:0 auto 18px"><b style="color:var(--gn);font-weight:600;letter-spacing:.14em;font-size:14px">WHY IT MATTERS</b><br>${esc(g.why)}</p>`:''}

       <p class="st">${esc(g.story)}</p>
       <div class="how" style="margin-top:22px"><div><h4>How ${up(A.manager)} wins</h4><ul>${g.how_a.map((s)=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="r"><h4>How ${up(B.manager)} wins</h4><ul>${g.how_b.map((s)=>`<li>${esc(s)}</li>`).join('')}</ul></div></div>
       <p style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-poster="${i}">View and download poster</button><a class="btn" href="rivalry.html?a=${A.slug}&b=${B.slug}">Rivalry file</a><a class="btn" href="playoffs.html">What it does to the race</a></p>
       <h4 class="tlh">When it swings<small>${g.timeline&&g.timeline.has_times?'by kickoff window, Eastern Time':'by game day'} · tap a window</small></h4><div id="tl${i}" data-sel="">${timelineHTML(g,null,A,B,tlW())}</div>

       <details class="fold"><summary>Starting lineups<small>as set in Sleeper${g.live?' · bold = scored so far':''} · Q = questionable</small></summary><div class="lu">${lu(g.lineup_a,0,g.a)}${lu(g.lineup_b,1,g.b)}</div></details></div></details>`}).join('');
    page.innerHTML=`${pv.banner?`<div class="banner"><b>${esc(pv.banner[0])}</b><span>${esc(pv.banner[1])}</span></div>`:''}<p class="lede" style="margin:0 0 14px">${pv.games.length} games. ${WK.projections?'Projected points':'Model estimates'} and modeled win chances; open any game for the full preview.</p>${det}

     <details class="fold"><summary>Last week in one paragraph</summary><p class="st" style="font-size:18px">${esc(pv.commentary)} <a href="week.html?w=${L.through_week}">Week ${L.through_week} recap →</a></p></details>

    let _tw=tlW();window.onresize=()=>{if(Math.abs(tlW()-_tw)>24){_tw=tlW();pv.games.forEach((g,i)=>{const box=document.getElementById('tl'+i);if(box)box.innerHTML=timelineHTML(g,box.dataset.sel===''?null:+box.dataset.sel,T(g.a),T(g.b),_tw)})}};
    if(location.hash)document.querySelector(location.hash)?.scrollIntoView()}
  function later(){document.getElementById('kind').textContent='NYC Dynasty · Coming up';document.getElementById('h').textContent=`Week ${w}`;document.getElementById('sub').textContent='Scheduled games · full preview appears when the week begins';
    page.innerHTML=(L.schedule[w]||[]).map(([a,b])=>{const p=winChance(L,a,b);return `<div class="mrow"><div class="l"><div class="who">${up(T(a).manager)}</div><small>${esc(T(a).team_name)} · ${esc(T(a).record)}</small></div><div class="mid"><div class="pp"><i>${Math.round(p*100)}%</i> <b>${100-Math.round(p*100)}%</b></div><div class="wbar"><i style="width:${(p*100).toFixed(1)}%"></i></div><small>model estimate</small></div><div class="r"><div class="who">${up(T(b).manager)}</div><small>${esc(T(b).team_name)} · ${esc(T(b).record)}</small></div></div>`}).join('')||'<p class="note">Schedule not available yet.</p>'}
  function recap(){const d=L.weeks[w],a=WK.awards[w],hs=H.weeks[w];document.getElementById('kind').textContent='NYC Dynasty · The Fallout';document.getElementById('h').textContent=`Week ${w} Recap`;document.title=`Week ${w} recap — NYC Dynasty League`;

  function draw(){history.replaceState(null,'',`week.html?w=${w}${location.hash}`);
    document.getElementById('tabs').innerHTML=`<a href="week.html?w=${L.through_week}" ${w===L.through_week?'aria-current="page"':''}>The Fallout · Wk ${L.through_week}</a>${pv.games.length?`<a href="week.html?w=${pv.week}" ${w===pv.week?'aria-current="page"':''}>The Hype Show · Wk ${pv.week}</a>`:''}<a href="playoffs.html">The Stakes</a>

}).catch((e)=>{console.error(e);document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
