<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Franchise — NYC Dynasty League</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div id="nav"></div><div id="page"></div>
<script src="assets/app.js"></script><script src="assets/sim.js"></script><script>
document.getElementById('nav').innerHTML=nav('Franchises');
loadAll().then(([c,L])=>{
  const q=new URLSearchParams(location.search).get('f')||'',legacy={pantheon:'vaibhav','the-pantheon':'vaibhav',varun:'nishant'};
  const f=c.franchises.find((x)=>x.slug===(legacy[q]||q)||String(x.roster_id)===q);
  if(!f){location.replace('./');return}
  const th=c.themes[f.theme],name=(id)=>c.byRoster[id]?.team_name||'—',link=(id)=>`<a href="franchise.html?f=${esc(c.byRoster[id].slug)}">${esc(name(id))}</a>`;
  document.title=`${f.team_name} — NYC Dynasty League`;
  const i=c.standings.indexOf(f.roster_id),prev=c.byRoster[c.standings[(i+11)%12]],next=c.byRoster[c.standings[(i+1)%12]];
  const max=Math.max(...f.results.flatMap((r)=>[r.pf,r.pa||0]),1);
  const h2h=Object.entries(f.h2h).map(([id,v])=>({id:+id,...v})).sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.w-a.w);
  const picks={};for(const p of f.future_picks)(picks[p.season]||=[]).push(p);
  const prior=f.seasons.filter((s)=>!s.same_owner);
  const id=f.roster_id,tm=L.teams[id],sim=simulate(c,L)[id],tw=thisWeek(c,L),note=topFiveNote(tw,id);
  const slotTop=sim.slot.indexOf(Math.max(...sim.slot)),yr=f.future_picks.length?Math.min(...f.future_picks.map((p)=>p.season)):null,ownR1=c.franchises.find((x)=>x.future_picks.some((p)=>p.season===yr&&p.round===1&&p.original_roster===id));
  const hh=(o)=>{const v=f.h2h[o];return v?`${v.w}–${v.l}`:'0–0'};
  document.getElementById('page').innerHTML=`
<header class="hero" id="hero"><div class="wrap">
 <div class="bar"><a href="./#franchises">← All franchises</a><span><a href="franchise.html?f=${esc(prev.slug)}">‹ ${esc(prev.team_name)}</a> &nbsp; <a href="franchise.html?f=${esc(next.slug)}">${esc(next.team_name)} ›</a></span></div>
 <div class="id">${emblem(th)}<div><div class="k">${esc(f.manager)}${stars(f)} · ${f.in_playoff_position?ord(f.seed)+' seed':ord(f.seed)+' in the standings'}${f.titles.length?` · Champion ${f.titles.join(', ')}`:''}</div>
  <h1 style="${fontOf(th)}">${esc(f.team_name)}</h1>${f.former_names.length?`<div class="was">Formerly ${esc(f.former_names.join(', '))}</div>`:''}</div></div>
 <div class="stats"><div><b>${esc(f.record)}</b><span>${c.season} record</span></div><div><b>${f.pf.toFixed(1)}</b><span>Points for · ${ord(f.points_rank)}</span></div><div><b>${f.pa.toFixed(1)}</b><span>Points against</span></div>
  <div><b>${f.streak?f.streak.type+f.streak.length:'—'}</b><span>Streak</span></div></div>
 <button class="btn play" id="play">▶ Play cinematic</button>
 <div id="cine"><video id="v" controls playsinline preload="none" poster="cinematics/${esc(f.slug)}.jpg"></video></div>
</div></header>
<div class="wrap">
 <section class="blk"><h3>The season so far</h3><p class="story">${esc(f.storyline.join(' '))}</p></section>
 <section class="blk"><h3>Path to the playoffs</h3><div class="big3"><div><b>${pct(sim.playoff)}</b><span>Make the playoffs</span></div><div><b>${pct(sim.top5)}</b><span>Top-five seed (on record)</span></div><div><b>${pct(sim.sixth)}</b><span>Sixth seed (on points)</span></div><div><b>${pct(sim.bye)}</b><span>First-round bye</span></div><div><b>${pct(sim.champ)}</b><span>Win the title</span></div><div><b>${sim.wins.toFixed(1)}</b><span>Projected wins</span></div></div>
  ${note?`<p class="story" style="font-size:20px">${note}</p>`:''}<p class="note">Percentages are simulated from scoring to date; the sentence above them, when shown, is exact arithmetic. <a href="playoffs.html">Try this week's scenarios →</a></p></section>
 <section class="blk"><h3>Still to play</h3><div class="tw"><table><tr><th>Week</th><th>Opponent</th><th class="num">Their record</th><th class="num">Their avg</th><th class="num">All-time</th><th class="num">Win chance</th>${tm.byes?'<th>Starters on bye</th>':''}</tr>
  ${tm.remaining.map((o)=>`<tr><td>${o.week}</td><td>${link(o.opp)}</td><td class="num">${esc(c.byRoster[o.opp].record)}</td><td class="num">${L.teams[o.opp].ppg}</td><td class="num"><a href="rivalry.html?a=${esc(f.slug)}&b=${esc(c.byRoster[o.opp].slug)}">${hh(o.opp)}</a></td><td class="num">${pct(winChance(L,id,o.opp))}</td>${tm.byes?`<td>${esc((tm.byes[o.week]||[]).join(', '))||'—'}${(L.teams[o.opp].byes[o.week]||[]).length?` <span class="note">· opponent: ${(L.teams[o.opp].byes[o.week]||[]).length}</span>`:''}</td>`:''}</tr>`).join('')||'<tr><td colspan="6">Regular season complete.</td></tr>'}</table></div>
  <p class="note">Remaining opponents average ${tm.sos??'—'} a week${tm.sos?` (league average ${(c.franchises.reduce((a,x)=>a+x.pf,0)/c.franchises.reduce((a,x)=>a+x.results.length,0)).toFixed(1)})`:''}. Win chance is a model estimate from season and recent scoring.${tm.byes?' Bye exposure counts last week\'s starters whose NFL team is off that week.':''}</p></section>
 <section class="blk"><h3>Week by week</h3><div class="weeks">${f.results.map((r)=>`<div class="w ${r.result}"><em>${r.pf.toFixed(0)}</em><div class="b" style="height:${(r.pf/max*72).toFixed(1)}%"><u style="bottom:${Math.min(100,(r.pa||0)/r.pf*100).toFixed(1)}%"></u></div><small>${r.result} · W${r.week}</small></div>`).join('')}</div>
  <p class="legend">Bar: points scored. White line: the opponent's score (shown at the top of the bar when the opponent scored more). Opponents: ${f.results.map((r)=>`W${r.week} ${esc(name(r.opp))}`).join(' · ')}</p></section>
 <section class="blk"><h3>Who has carried this team</h3><div class="players">${f.featured.map((p)=>`<div class="pl"><div class="n">${esc(p.name)}</div><div class="ppg"><b>${p.ppg.toFixed(1)}</b><span>PTS / START</span></div>
  <div class="m">${esc(p.position)} · ${esc(p.nfl_team)} · ${p.points.toFixed(1)} in ${p.starts} starts</div>${p.nickname?`<div class="nick">“${esc(p.nickname)}”</div>`:''}<div class="why">${esc(p.reason)}</div></div>`).join('')}</div>
  <h3 style="margin-top:26px">Biggest single games this season</h3><div class="chips">${tm.notable.map((n)=>`<span>${esc(n.name)} · <b>${n.points.toFixed(1)}</b> · Week ${n.week}</span>`).join('')}</div>
  <p class="note">Points per start counts only weeks the player was in this franchise's starting lineup in ${c.season}, in league scoring. Nicknames in quotes were set by the manager in Sleeper.</p></section>
 <div class="two">
 <section class="blk"><h3>All-time head to head</h3><div class="tw"><table><tr><th>Opponent</th><th>W–L</th><th>Avg score</th></tr>${h2h.map((x)=>`<tr><td>${link(x.id)}</td><td><a href="rivalry.html?a=${esc(f.slug)}&b=${esc(c.byRoster[x.id].slug)}">${x.w}–${x.l}${x.t?'–'+x.t:''}</a></td><td>${(x.pf/(x.w+x.l+x.t)).toFixed(1)} – ${(x.pa/(x.w+x.l+x.t)).toFixed(1)}</td></tr>`).join('')}</table></div>
  <p class="note">Every meeting since 2022, playoffs included, for this roster spot${prior.length?` (including seasons under ${esc(f.former_managers.join(', ')||'a previous manager')})`:''}.</p></section>
 <section class="blk"><h3>History</h3><div class="tw"><table><tr><th>Season</th><th>Record</th><th>Points</th><th>Finish</th></tr>${f.seasons.map((s)=>`<tr><td>${s.season}</td><td>${s.wins}–${s.losses}</td><td>${s.pf.toFixed(1)}</td><td>${s.champion?'<span class="tag gold">🏆 Champion</span>':s.runner_up?'<span class="tag silver">Runner-up</span>':s.toilet_bowl?'<span class="tag brown">🚽 Lost the Toilet Bowl</span>':''}${s.same_owner?'':' <span class="note">previous manager</span>'}</td></tr>`).join('')}</table></div>
  <p class="note">Franchise record score: ${tm.franchise_high.pf.toFixed(2)}, ${tm.franchise_high.season} Week ${tm.franchise_high.week} v ${esc(name(tm.franchise_high.opp))}. Power ranking: ${ord(tm.power.rank)}${tm.power.prev!==tm.power.rank?` (was ${ord(tm.power.prev)})`:''} · ${tm.momentum.label}: ${esc(tm.momentum.detail)}.</p>
  <h3 style="margin-top:28px">Draft position</h3><p class="note" style="font-size:16px;color:#c4c6cd">${yr?`This franchise's own ${yr} first-round pick ${sim.miss<.03?'projects to the 7–12 range (playoff teams pick by playoff result)':`has a ${pct(sim.miss)} chance of landing in the top six, most likely 1.${String(slotTop+1).padStart(2,'0')}`}. ${ownR1&&ownR1.roster_id!==id?`It is currently owned by ${esc(ownR1.team_name)}.`:ownR1?'It still owns that pick.':''}`:''} <a href="playoffs.html">Draft stakes →</a></p><div class="flag">${esc(L.rules.draft_flag)}</div>
  <h3 style="margin-top:28px">Future draft picks</h3>${Object.entries(picks).map(([y,ps])=>`<p class="k" style="margin:10px 0 6px">${y}</p><div class="chips">${ps.map((p)=>`<span>Round ${p.round}${p.original_roster!==f.roster_id?` · via ${esc(name(p.original_roster))}`:''}</span>`).join('')}</div>`).join('')||'<p class="note">None.</p>'}</section>
 </div>
 <section class="blk"><details class="ro"><summary>Current roster (${tm.roster.length})</summary><div class="rost">${tm.roster.map((p)=>`<div>${esc(p.name)} <em>${esc(p.position)} · ${esc(p.nfl_team)}${p.starter?' · starter':p.taxi?' · taxi':p.ir?' · IR':''}</em></div>`).join('')}</div></details></section>
 <footer>${esc(stamp(c))}</footer>
</div>`;
  themeVars(document.getElementById('hero'),th);document.querySelectorAll('.pl,.weeks').forEach((e)=>themeVars(e,th));
  document.getElementById('play').onclick=()=>{const box=document.getElementById('cine'),v=document.getElementById('v');box.style.display='block';if(!v.src)v.src=`cinematics/${f.slug}.mp4`;v.currentTime=0;v.play().catch(()=>{});box.scrollIntoView({behavior:'smooth',block:'center'})};
}).catch(()=>{document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
