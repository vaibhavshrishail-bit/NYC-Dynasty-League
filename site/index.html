      ${sh.heartbreak?tile('CRUELEST LOSS',M(sh.heartbreak.roster_id),`Scored ${f2(sh.heartbreak.points)}, lost to ${M(sh.heartbreak.opp)}`,sh.heartbreak.week):''}${sh.longest_win_streak?tile('LONGEST WIN STREAK',sh.longest_win_streak.length+' straight',`${M(sh.longest_win_streak.roster_id)}, Weeks ${sh.longest_win_streak.from}–${sh.longest_win_streak.to}`,sh.longest_win_streak.to):''}
      ${sh.top_starters&&sh.top_starters[0]?tile('MOST POINTS AS A STARTER',esc(sh.top_starters[0].name),`${f2(sh.top_starters[0].points)} in ${sh.top_starters[0].starts} starts · then ${sh.top_starters.slice(1,3).map((p)=>esc(p.name)+' '+p.points.toFixed(1)).join(', ')}`,0):''}${sh.top_defender_season?tile('TOP DEFENDER',esc(sh.top_defender_season.name),`${f2(sh.top_defender_season.points)} in ${sh.top_defender_season.starts} starts for ${M(sh.top_defender_season.roster_id)}`,0):''}
      ${sh.most_awards&&sh.most_awards.n>1?tile('MOST WEEKLY AWARDS',esc(sh.most_awards.name),`${sh.most_awards.n} solo awards for ${M(sh.most_awards.roster_id)}`,0):''}${sh.most_weekly_highs?tile('MOST WEEKLY HIGH SCORES',M(sh.most_weekly_highs.roster_id),`Top score of the week ${sh.most_weekly_highs.n} time${sh.most_weekly_highs.n>1?'s':''}`,0):''}</div>`:'';
    const bk=$('back');if(bk)bk.onclick=()=>{tm.value='0';render(0);scrollTo({top:0,behavior:'instant'})};
  }
  tm.onchange=()=>keepPlace(()=>render(+tm.value));render(0);
  const order=c.standings.map((id)=>c.byRoster[id]);
  $('grid').innerHTML=order.map((f,i)=>{const t=c.themes[f.theme],s=f.streak;
    return `<a class="card" href="franchise.html?f=${esc(f.slug)}" style="--c:${t.hi};--g:${t.flash};animation-delay:${i*45}ms" aria-label="${esc(f.team_name)}, ${esc(f.manager)}, ${c.season} record ${esc(f.record)}, ${f.pf.toFixed(1)} points for${f.titles.length?`, ${f.titles.length} titles`:''}">
<span class="seed">${ord(f.seed).toUpperCase()}</span>${f.in_playoff_position?'<span class="po">PLAYOFF SPOT</span>':''}${emblem(t)}
<h2 style="${fontOf(t)}"><span style="width:100%">${esc(f.team_name)}</span></h2><div class="mgr">${esc(f.manager)}${stars(f)}</div><div class="nums"><div><b>${esc(f.record)}</b><span>${c.season} record</span></div><div><b>${f.pf.toFixed(1)}</b><span>Points for · ${ord(f.points_rank)}</span></div></div>
<div class="dots">${f.results.map((r)=>`<i class="${r.result||''}" title="Week ${r.week}: ${r.result} ${r.pf}–${r.pa}"></i>`).join('')}</div>
${s?`<span class="pill ${s.type==='W'?'':'cold'}">${s.type==='W'?'Won':'Lost'} ${s.length} straight</span>`:''}</a>`}).join('');
  $('films').innerHTML=`<h3 class="sec">Films</h3><a class="film" href="documentary/"><img id="docimg" src="documentary/season-2026.jpg" alt="" loading="lazy"><div><span class="k" id="dock">Documentary · 88 seconds</span><b id="doct">The 2026 season, through Week 9</b><p class="note" style="font-size:17px" id="docn">Seven chapters on the unbeaten, the chase and the line. Plus <u>twelve franchise cinematics</u> in Franchise HQ.</p></div></a>`+`<p style="margin-top:12px"><a class="btn" href="timeline.html">The Dynasty Timeline: every season since 2022</a></p>`;
  loadEditions().then((ed)=>{const d=ed.documentary;if(!d)return;$('docimg').src=`documentary/${d.file}.jpg`;$('dock').textContent=`Documentary · ${d.duration} seconds · re-cut every Wednesday`;$('doct').textContent=`The ${d.season} season, through Week ${d.through_week}`;$('docn').innerHTML='The playoff race from preseason to now, then every week: the headline game, the MVP and the swing in the race. Plus <u>twelve franchise films</u> in Franchise HQ.'});
  $('st').textContent=`${c.season} · seeds 1–5 by record, seed 6 on points`;
  $('stand').innerHTML=order.map((f)=>`<li class="${f.seed===c.playoff_teams?'sixth':''}" style="display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><span>${f.seed}</span><a href="franchise.html?f=${esc(f.slug)}" style="text-decoration:none">${esc(f.team_name)} <span class="note">· ${esc(f.manager)}</span>${stars(f)}</a><span>${esc(f.record)}</span><span class="note">${f.pf.toFixed(1)} PF</span></li>`).join('');
  $('foot').textContent=`${stamp(c)} Crests are original artwork made for this site.`;
}).catch((e)=>{console.error(e);document.getElementById('hero').innerHTML='<p class="loading">League data could not be loaded. Try again in a minute.</p>'});
</script></body></html>
