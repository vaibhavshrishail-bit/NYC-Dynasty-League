<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>NYC Dynasty League — League Pulse</title><meta name="description" content="The NYC Dynasty League this week: the matchup that matters, the playoff race, power rankings and all twelve franchises.">
<link rel="stylesheet" href="assets/app.css"></head><body>
<div id="nav"></div><div id="tmbar"></div>
<div class="wrap show">
<header class="top" style="padding-bottom:10px"><div><div class="k" id="sub">NYC Dynasty League</div><h1 id="wk">League Pulse</h1><div class="k" id="state" style="margin-top:8px"></div></div>
<nav style="align-items:center"><label class="k" for="tm">Time machine</label><select class="sel" id="tm" aria-label="View the league as of a past week"></select></nav></header>
<section id="hero" aria-label="Top story"><p class="loading">Loading league data…</p></section>
<section class="blk" id="thisweek"></section>
<section class="blk two" id="race" style="gap:0 48px"></section>
<section class="blk" id="spot"></section>
<section class="blk" id="awards"></section>
<section class="blk" id="hl"></section>
<div id="nowonly">
<section class="blk" id="franchises"><h3 class="sec">Franchise HQ<small>cinematics · storylines · history</small></h3><main class="grid" id="grid" aria-label="Franchises" style="padding-top:0"></main></section>
<section class="blk" id="films"></section>
<details class="fold"><summary>Full standings<small id="st"></small></summary><ol id="stand" class="stand" style="border:0;padding:0;list-style:none;margin:0 0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:36px"></ol></details>
</div>
<footer id="foot"></footer></div>
<script src="assets/app.js"></script><script src="assets/sim.js"></script><script>
document.getElementById('nav').innerHTML=nav('League Pulse');
loadLive().then(([c,L,WK,H])=>{
  const T=(id)=>c.byRoster[id],th=(id)=>c.themes[T(id).theme],fl=(id)=>`franchise.html?f=${esc(T(id).slug)}`,nm=(id)=>esc(T(id).team_name),M=(id)=>esc(T(id).manager),f2=(x)=>x.toFixed(2),up=(x)=>esc(String(x).toUpperCase()),$=(id)=>document.getElementById(id);
  $('sub').textContent=`${c.league_name} · ${c.season} · Year Five`;
  const tm=$('tm'),hw=Object.keys(H.weeks).map(Number).sort((a,b)=>b-a);tm.innerHTML=`<option value="0">Now · Week ${c.current_week}</option>`+hw.map((w)=>`<option value="${w}">After Week ${w}</option>`).join('');
  const liveSim=simulate(c,L),pv=WK.preview;
  const hero=(o)=>`<div class="hero2"><div class="k" style="text-align:center;margin-bottom:12px">${o.kicker}</div><div class="names"><a class="l" href="${fl(o.a)}">${emblem(th(o.a))}<div class="nm">${up(T(o.a).manager)}</div><div class="tm">${nm(o.a)}${o.ra?' · '+o.ra:''}</div></a>
    <div class="num"><i>${o.sa}</i><span>${o.mid}</span><b>${o.sb}</b></div><a class="r" href="${fl(o.b)}">${emblem(th(o.b))}<div class="nm">${up(T(o.b).manager)}</div><div class="tm">${nm(o.b)}${o.rb?' · '+o.rb:''}</div></a></div>
    <div class="hl">${o.hl}</div><p class="why">${o.why}</p><div class="cta">${o.cta}</div></div>`;
  function render(asOf){
    const now=!asOf,w=asOf||L.through_week,hs=H.weeks[w],prev=H.weeks[w-1],aw=WK.awards[w],wkd=L.weeks[w];
    $('tmbar').innerHTML=now?'':`<div class="tmbar"><span>TIME MACHINE · You are viewing the league as it stood after Week ${w}</span><button id="back">Return to current week</button></div>`;
    $('nowonly').style.display=now?'':'none';
    $('wk').textContent=now?(c.current_week<=L.regular_season_end?`Week ${c.current_week}`:`Week ${c.current_week} · Playoffs`):`After Week ${w}`;
    $('state').innerHTML=now?(c.week_in_progress?`<span class="chip live">LIVE</span> Week ${c.current_week} in progress · scores provisional`:`Next up: Week ${c.current_week} · last final: Week ${L.through_week}`):`Everything on this page is as of Week ${w}`;
    const g=pv.games[0];
    if(now&&g)$('hero').innerHTML=hero({kicker:`Matchup of the week · Week ${pv.week}${g.kicker?' · '+esc(g.kicker):''}`,a:g.a,b:g.b,ra:esc(T(g.a).record),rb:esc(T(g.b).record),sa:f2(g.live?g.live[0]:g.projected[0]),sb:f2(g.live?g.live[1]:g.projected[1]),mid:g.live?'LIVE':'PROJECTED',
      hl:g.headline.map(esc).join('<br>'),why:esc(g.why||''),cta:`<a class="btn pri" href="week.html?w=${pv.week}#m0">Full preview</a><a class="btn" href="playoffs.html">What it does to the race</a><span class="chip" style="align-self:center">${up(g.rating)}</span>`});
    else{const cg=wkd.closest,cw=cg.pa>cg.pb?cg.a:cg.b,cl=cw===cg.a?cg.b:cg.a,u=aw.chaos,up2=u&&u.gap>=10;
      $('hero').innerHTML=hero(up2?{kicker:`Upset of the week · Week ${w}`,a:u.winner,b:u.loser,sa:f2(u.winner_pts),sb:f2(u.loser_pts),mid:'FINAL',hl:`${up(T(u.winner).manager)} WAS NOT SUPPOSED TO WIN THIS.`,why:`${M(u.winner)} came in averaging ${u.winner_ppg_before} a week against ${M(u.loser)}'s ${u.loser_ppg_before}.`,cta:`<a class="btn pri" href="week.html?w=${w}">Week ${w} recap and awards</a>`}
        :{kicker:`Game of the week · Week ${w}`,a:cw,b:cl,sa:f2(Math.max(cg.pa,cg.pb)),sb:f2(Math.min(cg.pa,cg.pb)),mid:'FINAL',hl:`DECIDED BY ${f2(Math.abs(cg.pa-cg.pb))}.`,why:`The closest game of Week ${w}.`,cta:`<a class="btn pri" href="week.html?w=${w}">Week ${w} recap and awards</a>`})}
    $('thisweek').innerHTML=now&&pv.games.length?`<h3 class="sec">This week<small>${c.week_in_progress?'live scores where games have started':'projected points'}</small></h3><div class="strip">${pv.games.map((x,i)=>`<a class="gm" href="week.html?w=${pv.week}#m${i}"><div class="l"><b>${up(T(x.a).manager)}</b><small>${esc(T(x.a).record)}</small></div><div class="c">${f2(x.live?x.live[0]:x.projected[0])} – ${f2(x.live?x.live[1]:x.projected[1])}<small>${x.live?'LIVE':up(x.rating)}</small></div><div class="r"><b>${up(T(x.b).manager)}</b><small>${esc(T(x.b).record)}</small></div></a>`).join('')}</div>`
      :`<h3 class="sec">Week ${w} results<small>final</small></h3><div class="strip">${wkd.games.map((x)=>`<a class="gm" href="week.html?w=${w}"><div class="l"><b style="${x.pa>x.pb?'':'opacity:.5'}">${up(T(x.a).manager)}</b></div><div class="c">${f2(x.pa)} – ${f2(x.pb)}</div><div class="r"><b style="${x.pb>x.pa?'':'opacity:.5'}">${up(T(x.b).manager)}</b></div></a>`).join('')}</div>`;
    const seeds=now?c.standings:hs.seeds,od=(id)=>now?liveSim[id].playoff:hs.odds[id].playoff,pw=now?L.pulse.power:hs.power,pprev=(id)=>now?L.teams[id].power.prev:(prev?prev.power.indexOf(id)+1:pw.indexOf(id)+1),rec=(id)=>now?T(id).record:`${hs.records[id].w}–${hs.records[id].l}`;
    $('race').innerHTML=`<div><h3 class="sec">The playoff picture<small>chance to make the six</small></h3>${seeds.map((id,i)=>`${i===c.playoff_teams?'<div class="cutline"><span>PLAYOFF LINE</span></div>':''}<div class="odds" style="--c:${th(id).hi};font-size:18px"><a href="${fl(id)}">${i+1}. ${M(id)} <span class="note">${rec(id)}</span></a><span class="p">${pct(od(id))}</span><span class="bar"><i style="width:${(od(id)*100).toFixed(1)}%"></i></span></div>`).join('')}
      <p class="note">${now?'Simulated from results through Week '+L.through_week+'.':hs.source==='recorded'?'Recorded when Week '+w+' ended.':'Reconstructed afterwards from results through Week '+w+', not a prediction made at the time.'} Seed 6 goes to the top scorer outside the top five.</p><p><a class="btn" href="playoffs.html">What if my team wins?</a> <a class="btn" href="universe.html?w=${w}">The race so far</a></p></div>
     <div><h3 class="sec">Power rankings<small>editorial, not the standings</small></h3><ol class="pr">${pw.map((id,i)=>{const d=pprev(id)-(i+1);return `<li style="font-size:18px"><span>${i+1}</span><span class="mv ${d>0?'up':d<0?'dn':''}">${d>0?'▲'+d:d<0?'▼'+(-d):'–'}</span><a href="${fl(id)}">${M(id)} <span class="note">${nm(id)}</span></a><span class="lab ${now?L.teams[id].momentum.label:''}">${now?L.teams[id].momentum.label:''}</span></li>`}).join('')}</ol>
      <details class="note" style="margin-top:8px"><summary style="cursor:pointer">How this is ranked</summary>40% record against every team every week, 35% scoring average, 25% last three weeks. Labels compare the last three weeks with the season average.</details></div>`;
    const rg=now&&pv.games.length?(pv.games.find((x)=>x.tag)||pv.games.find((x)=>x.series.games>=4&&!x.series.first_for_managers)):null;
    $('spot').innerHTML=rg?(()=>{const h=rg.history,last=h[h.length-1],close=h.reduce((p,m)=>Math.abs(m.a-m.b)<Math.abs(p.a-p.b)?m:p),big=h.reduce((p,m)=>Math.abs(m.a-m.b)>Math.abs(p.a-p.b)?m:p),A=T(rg.a),B=T(rg.b);
      return `<h3 class="sec">Rivalry spotlight<small>${esc(rg.tag||'this week')}</small></h3><div class="panel"><div class="vs"><a href="${fl(rg.a)}">${emblem(th(rg.a))}<div class="n" style="color:${th(rg.a).hi}">${esc(A.manager)}</div></a><div class="mid" style="font-family:'Bebas Neue';font-weight:400;font-size:clamp(40px,6vw,72px);color:#fff">${rg.series.a}–${rg.series.b}</div><a href="${fl(rg.b)}">${emblem(th(rg.b))}<div class="n" style="color:${th(rg.b).hi}">${esc(B.manager)}</div></a></div>
       <div class="big3"><div><b>${f2(Math.abs(close.a-close.b))}</b><span>Closest · ${close.season} Wk ${close.week}</span></div><div><b>${f2(Math.abs(big.a-big.b))}</b><span>Biggest win · ${esc((big.a>big.b?A:B).manager)}, ${big.season}</span></div><div><b>${esc((last.a>last.b?A:B).manager)}</b><span>Won the last one · ${last.season} Wk ${last.week}</span></div></div>
       <p><a class="btn" href="rivalry.html?a=${A.slug}&b=${B.slug}">Open the rivalry file</a></p></div>`})():'';
    const jug=hs?hs.power[0]:null;
    $('awards').innerHTML=`<h3 class="sec">Week ${w} awards<small>calculated from results</small></h3><div class="aw">
      ${aw.main_character?awardCard('main_character','THE MAIN CHARACTER',esc(aw.main_character.name),`${f2(aw.main_character.points)} for ${M(aw.main_character.roster_id)} in a game decided by ${f2(aw.main_character.margin)}.`):''}
      ${aw.heartbreaker?awardCard('heartbreaker','THE HEARTBREAKER',M(aw.heartbreaker.roster_id),`Scored ${f2(aw.heartbreaker.points)} and still lost to ${M(aw.heartbreaker.opp)}.`):''}
      ${aw.chaos?awardCard('chaos','THE CHAOS AWARD',M(aw.chaos.winner),`Beat ${M(aw.chaos.loser)} despite averaging ${aw.chaos.winner_ppg_before} a week to ${aw.chaos.loser_ppg_before}.`):''}
      ${aw.steamroller?awardCard('steamroller','THE STEAMROLLER',M(aw.steamroller.roster_id),`Won by ${f2(aw.steamroller.margin)} over ${M(aw.steamroller.opp)}.`):''}</div><p style="margin-top:12px"><a class="btn" href="week.html?w=${w}">All seven awards and the full recap</a></p>`;
    const sh=WK.season_highlights,hc=(lab,big,txt,wkk)=>`<a href="week.html?w=${wkk}" style="text-decoration:none"><div class="hi"><span>${lab} · WEEK ${wkk}</span><b>${big}</b><p>${txt}</p></div></a>`;
    $('hl').innerHTML=now?`<h3 class="sec">The season so far<small>updates as results come in</small></h3><div class="aw hl-strip">
      ${sh.high_score?hc('HIGHEST SCORE',f2(sh.high_score.pf),`${M(sh.high_score.roster_id)}.`,sh.high_score.week):''}${sh.biggest_upset?hc('BIGGEST UPSET',M(sh.biggest_upset.winner),`Beat ${M(sh.biggest_upset.loser)} averaging ${sh.biggest_upset.winner_ppg_before} to ${sh.biggest_upset.loser_ppg_before}.`,sh.biggest_upset.week):''}
      ${sh.closest?hc('CLOSEST FINISH',f2(sh.closest.v)+' pts',`${M(sh.closest.pa>sh.closest.pb?sh.closest.a:sh.closest.b)} over ${M(sh.closest.pa>sh.closest.pb?sh.closest.b:sh.closest.a)}.`,sh.closest.week):''}${sh.biggest_margin?hc('MOST DOMINANT WIN','+'+f2(sh.biggest_margin.margin),`${M(sh.biggest_margin.roster_id)} over ${M(sh.biggest_margin.opp)}.`,sh.biggest_margin.week):''}
      ${sh.best_player?hc('BEST SINGLE GAME',esc(sh.best_player.name),`${f2(sh.best_player.points)} for ${M(sh.best_player.roster_id)}.`,sh.best_player.week):''}${sh.heartbreak?hc('CRUELEST LOSS',M(sh.heartbreak.roster_id),`Scored ${f2(sh.heartbreak.points)}, lost to ${M(sh.heartbreak.opp)}.`,sh.heartbreak.week):''}
      ${sh.longest_win_streak?hc('LONGEST WIN STREAK',sh.longest_win_streak.length+' straight',`${M(sh.longest_win_streak.roster_id)}, Weeks ${sh.longest_win_streak.from}–${sh.longest_win_streak.to}.`,sh.longest_win_streak.to):''}</div>`:'';
    const bk=$('back');if(bk)bk.onclick=()=>{tm.value='0';render(0);scrollTo(0,0)};
  }
  tm.onchange=()=>{render(+tm.value);scrollTo(0,0)};render(0);
  const order=c.standings.map((id)=>c.byRoster[id]);
  $('grid').innerHTML=order.map((f,i)=>{const t=c.themes[f.theme],s=f.streak;
    return `<a class="card" href="franchise.html?f=${esc(f.slug)}" style="--c:${t.hi};--g:${t.flash};animation-delay:${i*45}ms" aria-label="${esc(f.team_name)}, ${esc(f.manager)}, ${c.season} record ${esc(f.record)}, ${f.pf.toFixed(1)} points for${f.titles.length?`, ${f.titles.length} titles`:''}">
<span class="seed">${ord(f.seed).toUpperCase()}</span>${f.in_playoff_position?'<span class="po">PLAYOFF SPOT</span>':''}${emblem(t)}
<h2 style="${fontOf(t)}"><span style="width:100%">${esc(f.team_name)}</span></h2><div class="mgr">${esc(f.manager)}${stars(f)}</div><div class="nums"><div><b>${esc(f.record)}</b><span>${c.season} record</span></div><div><b>${f.pf.toFixed(1)}</b><span>Points for · ${ord(f.points_rank)}</span></div></div>
<div class="dots">${f.results.map((r)=>`<i class="${r.result||''}" title="Week ${r.week}: ${r.result} ${r.pf}–${r.pa}"></i>`).join('')}</div>
${s?`<span class="pill ${s.type==='W'?'':'cold'}">${s.type==='W'?'Won':'Lost'} ${s.length} straight</span>`:''}</a>`}).join('');
  $('films').innerHTML=`<h3 class="sec">Films</h3><a class="film" href="documentary/"><img src="documentary/season-2026.jpg" alt="" loading="lazy"><div><span class="k">Documentary · 88 seconds</span><b>The 2026 season, through Week 9</b><p class="note" style="font-size:17px">Seven chapters on the unbeaten, the chase and the line. Plus <u>twelve franchise cinematics</u> in Franchise HQ.</p></div></a>`;
  $('st').textContent=`${c.season} · seeds 1–5 by record, seed 6 on points`;
  $('stand').innerHTML=order.map((f)=>`<li class="${f.seed===c.playoff_teams?'cut':''}" style="display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><span>${f.seed}</span><a href="franchise.html?f=${esc(f.slug)}" style="text-decoration:none">${esc(f.team_name)} <span class="note">· ${esc(f.manager)}</span>${stars(f)}</a><span>${esc(f.record)}</span><span class="note">${f.pf.toFixed(1)} PF</span></li>`).join('');
  $('foot').textContent=`${stamp(c)} Crests are original artwork made for this site.`;
}).catch((e)=>{console.error(e);document.getElementById('hero').innerHTML='<p class="loading">League data could not be loaded. Try again in a minute.</p>'});
</script></body></html>
