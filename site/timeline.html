<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="assets/brand/logo-64.png"><link rel="apple-touch-icon" href="assets/brand/logo-192.png"><meta property="og:image" content="https://vaibhavshrishail-bit.github.io/NYC-Dynasty-League/assets/brand/logo-512.png">
<title>Dynasty Timeline — NYC Dynasty League</title><meta name="description" content="Every season of the NYC Dynasty League since 2022: champions, title games, records, playoff games, trades and turning points.">
<link rel="stylesheet" href="assets/app.css">
<style>
.tls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.tls button{all:unset;cursor:pointer;box-sizing:border-box;border-radius:12px;padding:14px 12px 12px;background:rgba(255,255,255,.06);border:1.5px solid transparent;text-align:center;min-height:150px;color:#f2f4f8}
.tls button[aria-pressed=true]{background:#f2f4f8;color:#0f1b2d}.tls button:focus-visible,.tle:focus-visible,.tlf button:focus-visible{outline:3px solid #2b7fff;outline-offset:2px}
.tls b{display:block;font:400 40px/1 'Bebas Neue',sans-serif}.tls svg{width:64px;height:64px;margin:6px auto 4px;display:block}.tls span{display:block;font-size:16px;line-height:1.2}.tls small{display:block;font-size:13px;opacity:.75;margin-top:2px}
@media(max-width:600px){.tls{display:flex;overflow-x:auto;margin:14px -20px 4px;padding:0 20px 8px}.tls button{flex:0 0 132px}}
.tlf{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.tlf button{all:unset;cursor:pointer;min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line2);background:var(--card);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.tlf button[aria-pressed=true]{background:var(--invbg);color:var(--invfg);border-color:var(--invbg)}.tlf i{width:10px;height:10px;border-radius:50%;display:inline-block}
.rail{position:relative;margin:0;padding:0 0 0 26px;list-style:none}.rail::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line2);border-radius:2px}
.rail li{position:relative;margin:0 0 10px}.rail li::before{content:'';position:absolute;left:-25px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--dot,#586070);box-shadow:0 0 0 4px var(--bg)}
.rail .wk{font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px -26px;padding-left:26px}
.tle{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:60px}
.tle svg{width:42px;height:42px}.tle b{display:block;font-size:18px;line-height:1.2;font-weight:600}.tle small{display:block;font-size:15px;color:var(--dim);line-height:1.3}.tle em{font-style:normal;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dot)}
.tle[aria-expanded=true]{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}.tle.dim{opacity:.38}
.tld{background:var(--card);border:1.5px solid var(--txt);border-top:0;border-radius:0 0 10px 10px;margin:-12px 0 0;padding:16px 14px 12px;font-size:17px;line-height:1.45}.tld p{margin:0 0 8px}.tld .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 18px}.sumg div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.sumg b{display:block;font:400 30px/1 'Bebas Neue',sans-serif}.sumg span{font-size:14px;color:var(--dim)}
</style></head><body class="wr">
<div id="nav"></div>
<section class="band dark" style="padding-top:26px"><div class="wrap"><div class="k" style="color:#b6c0d0">League Archives · since 2022</div><h1 class="h-page" style="color:#f2f4f8">The Dynasty Timeline</h1>
 <p style="color:#dfe7f3;max-width:40em">Five seasons of the league. Pick a season, then tap any moment to open it.</p>
 <div class="q">1 · Choose a season</div><div class="tls" id="seasons" role="group" aria-label="Seasons"><p style="color:#b6c0d0">Loading league history…</p></div></div></section>
<section class="band"><div class="wrap" id="body"></div><div class="wrap"><footer id="foot"></footer></div></section>
<script src="assets/app.js"></script><script>
document.getElementById('nav').innerHTML=nav('Archives');
loadLive().then(([c,L,WK])=>{
  // A title for each finished season, written from the results: who won, which title it was for them, who they beat, and how the regular season went.
  const _done=()=>L.seasons.filter((x)=>x.complete).sort((a,b)=>a.season-b.season);
  const seasonTitle=(sn)=>{const d=_done(),i=d.findIndex((x)=>x.season===sn.season),prev=d[i-1],ch=who(sn.champion,sn.season),nth=d.slice(0,i+1).filter((x)=>x.champion===sn.champion).length,best=[...sn.standings].sort((a,b)=>b.wins-a.wins||b.pf-a.pf)[0],wire=best.roster_id===sn.champion?', wire to wire':'';
    let run=1;for(let k=i-1;k>=0&&d[k].champion===sn.champion;k--)run++;
    if(run>=3)return `${ch} completes the three-peat${wire}`;if(run===2)return `${ch} goes back-to-back${wire}`;
    if(prev&&prev.champion===sn.runner_up)return `${ch} dethrones ${who(sn.runner_up,sn.season)}${wire}`;
    if(i===0)return `${ch} takes the first crown${wire}`;if(nth===1)return `${ch}'s first title${wire}`;return `${ch} takes the crown back${wire}`};
  const seasonSub=(sn)=>{const d=_done(),i=d.findIndex((x)=>x.season===sn.season),nth=d.slice(0,i+1).filter((x)=>x.champion===sn.champion).length,best=[...sn.standings].sort((a,b)=>b.wins-a.wins||b.pf-a.pf)[0],ords=['','First','Second','Third','Fourth','Fifth'];
    return `${ords[nth]||nth+'th'} title for ${who(sn.champion,sn.season)}, over ${who(sn.runner_up,sn.season)} in the final.${best.roster_id!==sn.champion?` ${who(best.roster_id,sn.season)} had the best regular season at ${best.wins}–${best.losses}.`:` Best regular-season record too, at ${best.wins}–${best.losses}.`}`};
  const $=(id)=>document.getElementById(id),T=(id)=>c.byRoster[id],th=(id)=>c.themes[T(id).theme],f2=(x)=>x.toFixed(2),q=new URLSearchParams(location.search);
  // Who ran a roster in a given season: the current manager, unless Sleeper shows a different owner then.
  const who=(id,season)=>{const s=(T(id).seasons||[]).find((x)=>x.season===season);return s&&!s.same_owner&&T(id).former_managers.length?T(id).former_managers[0].split(' (')[0]:T(id).manager};
  const seasons=[...L.seasons].sort((a,b)=>a.season-b.season),TYPES={title:['Titles and finishes','#b07d00'],record:['League records','#7a3fd0'],playoff:['Playoff games','#1668a8'],trade:['Trades','#0a6b3c'],moment:['Moments','#b0203a'],change:['Changes','#586070']};
  const S={season:+q.get('s')||c.season,type:q.get('t')||'all',me:(c.franchises.find((f)=>f.slug===(q.get('f')||''))||{}).roster_id||null,open:null};
  const RLAB={high_score:'Highest score in league history',low_score:'Lowest score in league history',biggest_win:'Biggest win in league history',closest_game:'Closest game in league history'};
  function events(season){const E=[],sn=seasons.find((x)=>x.season===season),M=L.meetings.filter((m)=>m.s===season),add=(week,type,ids,title,sub,more,links)=>E.push({week,type,ids,title,sub,more:more||'',links:links||[]});
    const game=(m)=>{const w=m.pa>m.pb?m.a:m.b,l=w===m.a?m.b:m.a;return {w,l,ws:Math.max(m.pa,m.pb),ls:Math.min(m.pa,m.pb)}},riv=(a,b)=>['Rivalry file',`rivalry.html?a=${T(a).slug}&b=${T(b).slug}`];
    for(const m of M.filter((x)=>x.type==='championship')){const g=game(m);add(m.w,'title',[g.w,g.l],`${who(g.w,season)} won the ${season} championship`,`Beat ${who(g.l,season)} ${f2(g.ws)}–${f2(g.ls)} in the title game`,`${T(g.w).team_name} now ${T(g.w).titles.length>1?`has ${T(g.w).titles.length} titles (${[...T(g.w).titles].sort().join(', ')})`:'has one title'}. The margin was ${f2(g.ws-g.ls)}.`,[riv(g.w,g.l),['Franchise page',`franchise.html?f=${T(g.w).slug}`]])}
    if(sn&&sn.toilet_bowl)add(17,'title',[sn.toilet_bowl],`${who(sn.toilet_bowl,season)} lost the Toilet Bowl`,`Last place in the ${season} consolation bracket${punishOf(c,season)?' · Punishment: '+punishOf(c,season):''}`,`${punishOf(c,season)?'The punishment that year: '+punishOf(c,season)+'. ':''}Recorded for the roster now called ${T(sn.toilet_bowl).team_name}.`,[['Franchise page',`franchise.html?f=${T(sn.toilet_bowl).slug}`]]);
    if(sn&&sn.standings&&sn.standings.length){const b=sn.standings[0],top=[...sn.standings].sort((x,y)=>y.pf-x.pf)[0];add(sn.complete?14:c.through_week,'title',[b.roster_id],`${who(b.roster_id,season)} ${sn.complete?'finished':'leads'} with the best record, ${b.wins}–${b.losses}`,sn.complete?'Regular season':'Through Week '+c.through_week,`${who(top.roster_id,season)} ${sn.complete?'scored':'has scored'} the most points, ${top.pf.toFixed(1)}.`,[['Standings in the record book','archives.html']])}
    for(const m of M.filter((x)=>x.type==='playoff')){const g=game(m);add(m.w,'playoff',[g.w,g.l],`${who(g.w,season)} beat ${who(g.l,season)} in the playoffs`,`${f2(g.ws)}–${f2(g.ls)}`,`A margin of ${f2(g.ws-g.ls)} in Week ${m.w}.`,[riv(g.w,g.l)])}
    for(const [k,lab] of Object.entries(RLAB)){const r=L.records[k];if(r&&r.season===season)add(r.week,'record',[r.roster_id,r.opp],lab,k==='closest_game'||k==='biggest_win'?`${who(r.roster_id,season)} ${f2(r.pf)}, ${who(r.opp,season)} ${f2(r.pa)}`:`${who(r.roster_id,season)} scored ${f2(r.pf)} against ${who(r.opp,season)}`,`Still the league record. ${r.type!=='regular'?'It came in the '+typeLabel[r.type].toLowerCase()+' bracket.':''}`,[riv(r.roster_id,r.opp)])}
    const mp=L.records.most_points_season,br=L.records.best_record_season,ws=L.records.longest_win_streak;
    if(mp&&mp.season===season)add(14,'record',[mp.roster_id],'Most points in a season',`${who(mp.roster_id,season)} scored ${mp.pf.toFixed(1)}`,'The league record for a full season.',[['Franchise page',`franchise.html?f=${T(mp.roster_id).slug}`]]);
    if(br&&br.season===season)add(14,'record',[br.roster_id],'Best regular-season record',`${who(br.roster_id,season)} went ${br.wins}–${br.losses}`,'The league record.',[['Franchise page',`franchise.html?f=${T(br.roster_id).slug}`]]);
    if(ws&&ws.to.season===season)add(ws.to.week,'record',[ws.roster_id],`Longest winning streak: ${ws.length} games`,`${who(ws.roster_id,season)}, ${ws.from.season} Week ${ws.from.week} to ${ws.to.season} Week ${ws.to.week}`,'Regular-season games only.',[['Franchise page',`franchise.html?f=${T(ws.roster_id).slug}`]]);
    for(const t of (season===c.season?c.trades:(c.past_trades||[]).filter((x)=>x.season===season))){const [a,b]=t.rosters,pl=t.players.map((p)=>`${p.name} to ${who(p.to_roster,season)}`),pk=t.picks.map((p)=>`${p.season} round ${p.round}${p.original_roster!==undefined&&T(p.original_roster)?` (${who(p.original_roster,season)}'s)`:''} to ${who(p.to_roster,season)}`);
      add(t.week,'trade',t.rosters,`${t.rosters.map((r)=>who(r,season)).join(' and ')} made a trade`,[...pl.slice(0,2),...(pl.length>2?[`${pl.length-2} more player${pl.length>3?'s':''}`]:[])].join(' · ')||`${pk.length} pick${pk.length>1?'s':''} moved`,[pl.length?'Players: '+pl.join('; ')+'.':'',pk.length?'Picks: '+pk.join('; ')+'.':''].filter(Boolean).join(' '),b?[riv(a,b)]:[])}
    if(season===c.season){const h=WK.season_highlights||{},wkl=(w)=>['Week '+w+' recap',`week.html?w=${w}`];
      if(h.high_score)add(h.high_score.week,'moment',[h.high_score.roster_id],`Highest score of ${season}: ${f2(h.high_score.pf)}`,`${who(h.high_score.roster_id,season)}`,'',[wkl(h.high_score.week)]);
      if(h.biggest_upset)add(h.biggest_upset.week,'moment',[h.biggest_upset.winner,h.biggest_upset.loser],`Biggest upset of ${season}`,`${who(h.biggest_upset.winner,season)} beat ${who(h.biggest_upset.loser,season)}`,`${who(h.biggest_upset.winner,season)} went in with a ${Math.round(h.biggest_upset.win_prob*100)}% chance to win on the site's model.`,[wkl(h.biggest_upset.week),riv(h.biggest_upset.winner,h.biggest_upset.loser)]);
      if(h.closest){const a=h.closest.pa>h.closest.pb?h.closest.a:h.closest.b,b=a===h.closest.a?h.closest.b:h.closest.a;add(h.closest.week,'moment',[a,b],`Closest finish of ${season}: ${f2(h.closest.v)} points`,`${who(a,season)} over ${who(b,season)}`,'',[wkl(h.closest.week),riv(a,b)])}
      if(h.biggest_margin)add(h.biggest_margin.week,'moment',[h.biggest_margin.roster_id,h.biggest_margin.opp],`Most dominant win of ${season}: +${f2(h.biggest_margin.margin)}`,`${who(h.biggest_margin.roster_id,season)} over ${who(h.biggest_margin.opp,season)}`,'',[wkl(h.biggest_margin.week)]);
      if(h.best_player)add(h.best_player.week,'moment',[h.best_player.roster_id],`Best single game of ${season}: ${h.best_player.name}`,`${f2(h.best_player.points)} points for ${who(h.best_player.roster_id,season)}`,'',[wkl(h.best_player.week)]);
      if(h.longest_win_streak)add(h.longest_win_streak.to,'moment',[h.longest_win_streak.roster_id],`${who(h.longest_win_streak.roster_id,season)} won ${h.longest_win_streak.length} straight`,`Weeks ${h.longest_win_streak.from}–${h.longest_win_streak.to}`,'',[['Franchise page',`franchise.html?f=${T(h.longest_win_streak.roster_id).slug}`]]);
      for(const e of (WK.season_story||[]))if(e.swing)add(e.week,'moment',[e.swing.won?e.swing.roster_id:e.swing.opp,e.swing.won?e.swing.opp:e.swing.roster_id],`Race swing: ${T(e.swing.won?e.swing.roster_id:e.swing.opp).team_name} beat ${T(e.swing.won?e.swing.opp:e.swing.roster_id).team_name}`,`${who(e.swing.roster_id,season)}'s playoff chance: ${pct(e.swing.from)} → ${pct(e.swing.to)}`,e.swing.text+' Playoff chances for early weeks were calculated afterwards from results through each week.',[wkl(e.week),riv(e.swing.roster_id,e.swing.opp),['War Room','playoffs.html']]);
      for(const f of c.franchises){const cur=f.seasons.find((x)=>x.season===season),prev=f.seasons.find((x)=>x.season===season-1);if(cur&&prev&&cur.same_owner&&!prev.same_owner)add(0,'change',[f.roster_id],`${f.manager} took over ${f.team_name}`,`Previously managed by ${f.former_managers.join(', ')}`,'Results before this season stay with the roster and are shown under the previous manager.',[['Franchise page',`franchise.html?f=${f.slug}`]])}}
    return E.sort((x,y)=>x.week-y.week||(x.type<y.type?-1:1))}
  function drawSeasons(){$('seasons').innerHTML=seasons.map((s)=>`<button data-s="${s.season}" aria-pressed="${s.season===S.season}"><b>${s.season}</b>${s.champion?`${emblem(th(s.champion))}<span>${esc(who(s.champion,s.season))}</span><small>champion</small>`:`${emblem(th(s.standings[0].roster_id))}<span>${esc(who(s.standings[0].roster_id,s.season))}</span><small>leads, in progress</small>`}</button>`).join('');
    $('seasons').querySelectorAll('button').forEach((b)=>b.onclick=()=>{S.season=+b.dataset.s;S.open=null;draw()});const on=$('seasons').querySelector('[aria-pressed=true]');if(on&&$('seasons').scrollWidth>$('seasons').clientWidth)$('seasons').scrollLeft=on.offsetLeft-$('seasons').offsetLeft-20}
  function drawBody(){const sn=seasons.find((x)=>x.season===S.season),E=events(S.season),shown=E.filter((e)=>S.type==='all'||e.type===S.type),counts=Object.fromEntries(Object.keys(TYPES).map((k)=>[k,E.filter((e)=>e.type===k).length]));let lastW=null;
    $('body').innerHTML=`<div class="q">${S.season}${sn.complete?'':' · in progress'}</div><h2>${sn.champion?esc(seasonTitle(sn)):`The ${S.season} season so far`}</h2>${sn.champion?`<p class="note" style="margin-top:-6px">${esc(seasonSub(sn))}</p>`:''}
     <div class="sumg">${sn.champion?`<div><b>${esc(who(sn.champion,S.season))}</b><span>Champion</span></div>`:`<div><b>Week 17</b><span>Champion decided</span></div>`}${sn.runner_up?`<div><b>${esc(who(sn.runner_up,S.season))}</b><span>Runner-up</span></div>`:''}${sn.toilet_bowl?`<div><b>${esc(who(sn.toilet_bowl,S.season))}</b><span>Lost the Toilet Bowl${punishOf(c,S.season)?' · '+esc(punishOf(c,S.season)):''}</span></div>`:!sn.complete&&punishOf(c,S.season)?`<div><b>${esc(punishOf(c,S.season))}</b><span>This season's Toilet Bowl punishment</span></div>`:''}<div><b>${esc(who(sn.standings[0].roster_id,S.season))} ${sn.standings[0].wins}–${sn.standings[0].losses}</b><span>Best record</span></div></div>
     <div class="q">2 · Filter the moments</div><div class="tlf" role="group" aria-label="Kinds of moment"><button data-t="all" aria-pressed="${S.type==='all'}">Everything (${E.length})</button>${Object.entries(TYPES).filter(([k])=>counts[k]).map(([k,[lab,col]])=>`<button data-t="${k}" aria-pressed="${S.type===k}"><i style="background:${col}"></i>${lab} (${counts[k]})</button>`).join('')}</div>
     <p class="sm" style="margin:-8px 0 14px"><label for="mef">Follow a franchise: </label><select class="sel" id="mef"><option value="">All twelve</option>${c.standings.map((id)=>`<option value="${id}" ${id===S.me?'selected':''}>${esc(T(id).manager)}</option>`).join('')}</select></p>
     ${shown.length?`<ol class="rail">${shown.map((e,i)=>{const k=`${e.week}-${e.type}-${e.title}`,op=S.open===k,hd=e.week!==lastW?`<div class="wk">${e.week?`Week ${e.week}${e.week>=15?' · playoffs':''}`:'Before the season'}</div>`:'';lastW=e.week;
       return `<li style="--dot:${TYPES[e.type][1]}">${hd}<button class="tle ${S.me&&!e.ids.includes(S.me)?'dim':''}" data-e="${esc(k)}" aria-expanded="${op}">${emblem(th(e.ids[0]))}<span><em>${TYPES[e.type][0]}</em><b>${esc(e.title)}</b><small>${esc(e.sub)}</small></span></button>
        ${op?`<div class="tld">${e.more?`<p>${esc(e.more)}</p>`:''}<p class="sm">${e.ids.map((id)=>`${esc(T(id).team_name)}${who(id,S.season)!==T(id).manager?` (then managed by ${esc(who(id,S.season))})`:''}`).join(' · ')}</p><div class="row">${e.links.map(([t,u])=>`<a class="b2" href="${u}">${esc(t)}</a>`).join('')}<button class="b2 on" data-close="1">Close</button></div></div>`:''}</li>`}).join('')}</ol>`:'<p>Nothing of this kind in this season.</p>'}
     <p class="sm" style="margin-top:18px">Every entry is calculated from Sleeper results. ${(c.trade_seasons||[c.season]).length>1?`Trades are shown for ${c.trade_seasons.join(', ')}.`:`Trades from earlier seasons are fetched from Sleeper at the next data refresh.`} Franchise names are the current ones; where a roster had a different manager, the manager of that season is named. Team names used in earlier seasons are not stored by Sleeper and are not shown.</p>`;
    $('body').querySelectorAll('[data-t]').forEach((b)=>b.onclick=()=>keepPlace(()=>{S.type=b.dataset.t;S.open=null;drawBody()}));$('mef').onchange=(e)=>keepPlace(()=>{S.me=+e.target.value||null;drawBody()});
    $('body').querySelectorAll('[data-e]').forEach((b)=>b.onclick=()=>keepPlace(()=>{S.open=S.open===b.dataset.e?null:b.dataset.e;drawBody()}));$('body').querySelectorAll('[data-close]').forEach((b)=>b.onclick=()=>keepPlace(()=>{S.open=null;drawBody()}))}
  function draw(){history.replaceState(null,'',`timeline.html?s=${S.season}`);drawSeasons();drawBody()}
  draw();$('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('body').innerHTML='<p>League history could not be loaded. Try again in a minute.</p>'});
</script></body></html>
