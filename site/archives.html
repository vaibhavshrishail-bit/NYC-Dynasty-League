<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>League Archives — NYC Dynasty League</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div id="nav"></div><div class="wrap" style="padding-top:26px;padding-bottom:50px"><div class="k">League Archives · since 2022</div><h1 class="h-page">The record book</h1><div id="page"></div><footer id="foot"></footer></div>
<script src="assets/app.js"></script><script>
document.getElementById('nav').innerHTML=nav('Archives');
loadAll().then(async([c,L])=>{
  const T=(id)=>c.byRoster[id],fl=(id)=>`<a href="franchise.html?f=${esc(T(id).slug)}">${esc(T(id).team_name)}</a>`,R=L.records;
  const who=(id,season)=>{const s=L.seasons.find((x)=>x.season===season)?.standings.find((x)=>x.roster_id===id);return fl(id)+(s&&!s.same_owner?` <span class="note">(then managed by ${esc(T(id).former_managers[0]||s.handle)})</span>`:` <span class="note">${esc(T(id).manager)}</span>`)};
  const g=(x)=>`${who(x.roster_id,x.season)} ${x.pf.toFixed(2)}–${x.pa.toFixed(2)} v ${esc(T(x.opp).team_name)}, ${x.season} Week ${x.week}${x.type!=='regular'?' ('+typeLabel[x.type]+')':''}`;
  const docs=await fetch('documentary/index.json').then((r)=>r.json()).catch(()=>[]);
  const done=L.seasons.filter((s)=>s.complete).sort((a,b)=>b.season-a.season);
  document.getElementById('page').innerHTML=`
<section class="blk"><h3>Champions</h3><div class="tw"><table><tr><th>Season</th><th>Champion</th><th>Runner-up</th><th>Lost the Toilet Bowl</th></tr>${done.map((s)=>`<tr><td>${s.season}</td><td><span class="stars">★</span> ${who(s.champion,s.season)}</td><td>${who(s.runner_up,s.season)}</td><td>${s.toilet_bowl?who(s.toilet_bowl,s.season):'—'}</td></tr>`).join('')}</table></div></section>
<section class="blk"><h3>All-time table</h3><div class="tw"><table><tr><th>Franchise</th><th class="num">Regular season</th><th class="num">Win %</th><th class="num">Points</th><th class="num">Playoff games</th><th class="num">Finals</th><th>Titles</th><th>Toilet Bowl losses</th></tr>
 ${R.all_time.map((t)=>`<tr><td>${fl(t.roster_id)}</td><td class="num">${t.wins}–${t.losses}</td><td class="num">${(t.wins/(t.wins+t.losses)*100).toFixed(0)}%</td><td class="num">${t.pf.toFixed(1)}</td><td class="num">${t.playoff_wins}–${t.playoff_losses}</td><td class="num">${t.finals}</td><td>${t.titles.length?'<span class="stars">'+'★'.repeat(t.titles.length)+'</span> '+t.titles.sort().join(', '):''}</td><td>${t.toilet_bowls.sort().join(', ')}</td></tr>`).join('')}</table></div>
 <p class="note">Records follow the roster spot through team renames and changes of manager. ${c.franchises.filter((f)=>f.former_managers.length).map((f)=>`${esc(f.team_name)} was managed by ${esc(f.former_managers.join(', '))}.`).join(' ')} Includes ${c.season} to date.</p></section>
<section class="blk"><h3>Records</h3><div class="tw"><table>
 <tr><td>Highest score</td><td>${g(R.high_score)}</td></tr><tr><td>Lowest score</td><td>${g(R.low_score)}</td></tr><tr><td>Biggest win</td><td>${g(R.biggest_win)} (by ${(R.biggest_win.pf-R.biggest_win.pa).toFixed(2)})</td></tr>
 <tr><td>Closest game</td><td>${g(R.closest_game)} (by ${(R.closest_game.pf-R.closest_game.pa).toFixed(2)})</td></tr>
 <tr><td>Most points in a season</td><td>${who(R.most_points_season.roster_id,R.most_points_season.season)} ${R.most_points_season.pf.toFixed(2)}, ${R.most_points_season.season}</td></tr>
 <tr><td>Best regular-season record</td><td>${who(R.best_record_season.roster_id,R.best_record_season.season)} ${R.best_record_season.wins}–${R.best_record_season.losses}, ${R.best_record_season.season}</td></tr>
 <tr><td>Longest regular-season win streak</td><td>${fl(R.longest_win_streak.roster_id)} ${R.longest_win_streak.length} games, ${R.longest_win_streak.from.season} Week ${R.longest_win_streak.from.week} to ${R.longest_win_streak.to.season} Week ${R.longest_win_streak.to.week}</td></tr></table></div>
 <p class="note">Game records cover every game Sleeper has for the league, including playoff, consolation and Toilet Bowl games. Season records cover completed seasons.</p></section>
<section class="blk"><h3>Final standings</h3><p><select class="sel" id="ys">${done.map((s)=>`<option>${s.season}</option>`).join('')}</select></p><div class="tw" id="yt"></div></section>
<section class="blk"><h3>Films</h3><div class="chips">${docs.map((d)=>`<span><a href="documentary/${esc(d.page||'')}">${esc(d.title)}</a> · ${esc(d.note)}</span>`).join('')||'<span><a href="documentary/">Season documentary</a></span>'}<span><a href="cinematics/">12 franchise cinematics</a></span></div></section>
<section class="blk"><h3>${c.season} trade log</h3>${c.trades.length?[...c.trades].reverse().map((t)=>`<div class="meet" style="grid-template-columns:70px 1fr"><span class="t">Week ${t.week}</span><span>${t.rosters.map((r)=>{const got=[...t.players.filter((p)=>p.to_roster===r).map((p)=>esc(p.name)),...t.picks.filter((p)=>p.to_roster===r).map((p)=>`${p.season} round ${p.round}${p.original_roster!==r?' ('+esc(T(p.original_roster).team_name)+')':''}`)];return `<b>${esc(T(r).team_name)}</b> received ${got.join(', ')||'nothing listed'}`}).join('<br>')}</span></div>`).join(''):'<p class="note">No trades yet.</p>'}
 <p class="note">A record of completed trades as Sleeper reports them. Earlier seasons' trades are not loaded.</p></section>`;
  const ys=document.getElementById('ys'),yt=()=>{const s=L.seasons.find((x)=>x.season===+ys.value);document.getElementById('yt').innerHTML=`<table><tr><th>#</th><th>Franchise</th><th>Manager then</th><th class="num">Record</th><th class="num">PF</th><th class="num">PA</th><th></th></tr>${s.standings.map((t,i)=>`<tr><td>${i+1}</td><td>${fl(t.roster_id)}</td><td>${t.same_owner?esc(T(t.roster_id).manager):esc(T(t.roster_id).former_managers[0]||t.handle)}</td><td class="num">${t.wins}–${t.losses}</td><td class="num">${t.pf.toFixed(1)}</td><td class="num">${t.pa.toFixed(1)}</td><td>${s.champion===t.roster_id?'<span class="tag gold">🏆 Champion</span>':s.runner_up===t.roster_id?'<span class="tag silver">Runner-up</span>':s.toilet_bowl===t.roster_id?'<span class="tag brown">🚽 Lost the Toilet Bowl</span>':''}</td></tr>`).join('')}</table><p class="note">Ordered by regular-season record, then points for. Franchises are shown under their current names.</p>`};
  ys.onchange=yt;yt();document.getElementById('foot').textContent=stamp(c);
}).catch((e)=>{console.error(e);document.getElementById('page').textContent='League data could not be loaded. Try again shortly.'});
</script></body></html>
