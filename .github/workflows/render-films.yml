# Re-renders the second-edition films from fresh Sleeper data every Wednesday morning, one film per parallel job.
# Which films: src/config/films.json. The first editions (<slug>.mp4, season-<year>.mp4) are never touched.
# Finished films are published to the "films" branch as a single commit that is replaced each week, so the
# repository does not grow by a few hundred megabytes of video history every week. The deploy workflow lays that
# branch over site/ before it publishes. If one film fails to render, last week's copy of it is kept.
name: Render films
on:
  schedule:
    - cron: '40 11 * * 3'   # Wednesdays 11:40 UTC: 6:40am Eastern in winter, 7:40am in summer
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: render-films
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.t.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          f = json.load(open('src/config/films.json'))
          t = list(f.get('second_edition', [])) + (['documentary'] if f.get('documentary_second_edition') else [])
          print('targets=' + json.dumps(t))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy scipy playwright
          python -m playwright install --with-deps chromium
      - name: Fresh league data
        run: |
          node scripts/fetch-sleeper.mjs
          node scripts/build-canonical.mjs
          node scripts/build-league.mjs
          node scripts/build-weekly.mjs
      - name: Render
        run: |
          if [ "${{ matrix.target }}" = "documentary" ]; then python scripts/build_documentary2.py render; else python scripts/build_cinematics.py render2 "${{ matrix.target }}"; fi
      - name: Check the output is a playable film, and collect it
        run: |
          mkdir -p out/site/cinematics out/site/documentary
          if [ "${{ matrix.target }}" = "documentary" ]; then cp site/documentary/*-v2.* out/site/documentary/; else cp site/cinematics/${{ matrix.target }}-v2.* out/site/cinematics/; fi
          for f in out/site/*/*-v2.mp4; do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f"); echo "$f ${d}s"
            python3 -c "import sys; d=float('$d'); sys.exit(0 if 40 < d < 150 else 1)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ matrix.target }}
          path: out
          retention-days: 3
  publish:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start from last week's films, then lay this week's over them
        run: |
          if git fetch --depth=1 origin films 2>/dev/null; then git archive FETCH_HEAD | tar -x; echo "kept last week's films as the base"; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: film-*
          merge-multiple: true
          path: .
        continue-on-error: true
      - name: Write the list of films that exist
        run: |
          python3 - <<'PY'
          import json, glob, os, datetime
          fr = sorted(os.path.basename(p)[:-7] for p in glob.glob('site/cinematics/*-v2.mp4'))
          doc = None
          for p in sorted(glob.glob('site/documentary/*-v2.json')):
              d = json.load(open(p)); doc = {'file': os.path.basename(p)[:-5], 'duration': round(d.get('duration', 0)), 'through_week': d.get('through_week'), 'season': d.get('season')}
          json.dump({'franchise_second_edition': fr, 'documentary': doc, 'rendered_at': datetime.datetime.utcnow().isoformat() + 'Z'}, open('site/cinematics/editions.json', 'w'), indent=1)
          print(fr, doc)
          assert fr or doc, 'no films were produced or kept'
          PY
      - name: Publish to the films branch (one commit, replaced each week)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan films-next
          git rm -rfq --cached .
          git add -f site/cinematics/*-v2.mp4 site/cinematics/*-v2.jpg site/cinematics/editions.json
          git add -f site/documentary/*-v2.mp4 site/documentary/*-v2.jpg site/documentary/*-v2.json 2>/dev/null || true
          git commit -q -m "Films rendered $(date -u +%F)"
          git push -q -f origin films-next:films
      - name: Publish the site
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run refresh-and-deploy.yml --ref main || echo "The site will pick the films up at its next scheduled refresh"
