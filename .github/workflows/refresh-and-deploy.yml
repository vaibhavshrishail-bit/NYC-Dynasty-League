name: Refresh Sleeper data and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sleeper.mjs
      - name: Reconcile identities and build the canonical league file
        run: node scripts/build-canonical.mjs
      - name: Build pulse, schedule, rivalry and archive data
        run: node scripts/build-league.mjs
      - name: Build this week's preview, awards and the week-by-week history
        run: node scripts/build-weekly.mjs
      - name: Check the playoff model before publishing
        run: node scripts/test-playoff-model.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install the test browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser regression test (every route, phone and desktop, after each interaction)
        run: python tests/site_test.py --ci
      - name: Commit data if changed
        run: |
          git config user.name "sleeper-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || { git commit -m "Refresh Sleeper data"; git pull --rebase origin main; git push; }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
