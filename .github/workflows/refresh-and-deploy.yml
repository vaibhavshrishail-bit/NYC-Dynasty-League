name: Refresh Sleeper data and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
    # Game windows (UTC; Eastern is UTC-5 in winter, UTC-4 before November): a full rebuild every 20 minutes so win chances,
    # awards and standings follow the games. Between builds each page reads live scores from Sleeper in the browser.
    - cron: '7,27,47 17-23 * * 0,4,6'   # Sunday, Thursday (incl. Thanksgiving) and Saturday afternoons and evenings
    - cron: '7,27,47 0-5 * * 0,1,2,5'   # late games: Saturday, Sunday, Monday and Thursday nights
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sleeper.mjs
      - name: Reconcile identities and build the canonical league file
        run: node scripts/build-canonical.mjs
      - name: Build pulse, schedule, rivalry and archive data
        run: node scripts/build-league.mjs
      - name: Build this week's preview, awards and the week-by-week history
        run: node scripts/build-weekly.mjs
      - name: Check the playoff model before publishing
        run: node scripts/test-playoff-model.mjs
      - name: Lay the weekly films over the site (from the films branch, if it exists)
        run: |
          if git fetch --depth=1 origin films 2>/dev/null; then git archive FETCH_HEAD | tar -x; ls site/cinematics | grep -c -- '-v2.mp4' || true; else echo "no films branch yet"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install the test browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser regression test (every route, phone and desktop, after each interaction)
        run: python tests/site_test.py --ci
      - name: Regression checks for fixed defects (exports, film links, modal focus, route context, one win chance)
        run: python tests/regression_test.py
      - name: Commit data if changed
        run: |
          git config user.name "sleeper-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || { git commit -m "Refresh Sleeper data"; git pull --rebase --autostash origin main; git push; }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Lay the weekly films over the site (from the films branch, if it exists)
        run: |
          if git fetch --depth=1 origin films 2>/dev/null; then git archive FETCH_HEAD | tar -x; ls site/cinematics | grep -c -- '-v2.mp4' || true; else echo "no films branch yet"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
