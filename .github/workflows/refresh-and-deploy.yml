name: Refresh Sleeper data and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # every hour, so midweek trades and roster moves reach every page within about an hour
    # Game windows (UTC; Eastern is UTC-5 in winter, UTC-4 before November): a full rebuild every 20 minutes so win chances,
    # awards and standings follow the games. Between builds each page reads live scores from Sleeper in the browser.
    - cron: '7,27,47 17-23 * * 0,4,6'   # Sunday, Thursday (incl. Thanksgiving) and Saturday afternoons and evenings
    - cron: '7,27,47 13-16 * * 0'        # Sunday morning: international and early kickoffs
    - cron: '7,27,47 0-5 * * 0,1,2,5'   # late games: Saturday, Sunday, Monday and Thursday nights
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-sleeper.mjs
      - name: Reconcile identities and build the canonical league file
        run: node scripts/build-canonical.mjs
      - name: Build pulse, schedule, rivalry and archive data
        run: node scripts/build-league.mjs
      - name: Build this week's preview, awards and the week-by-week history
        run: node scripts/build-weekly.mjs
      - name: Check the playoff model before publishing
        run: node scripts/test-playoff-model.mjs
      - name: Lay the weekly films over the site (from the films branch, if it exists)
        run: |
          if git fetch --depth=1 origin films 2>/dev/null; then git archive FETCH_HEAD | tar -x; ls site/cinematics | grep -c -- '-v2.mp4' || true; else echo "no films branch yet"; fi
      - name: Re-render the films if a new week has finished
        # The Wednesday schedule in render-films.yml can be delayed or skipped by GitHub. This is the backstop: whenever the site
        # data is ahead of the published films, and no render is already queued or running, start one. It publishes itself when done.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          SITE=$(node -e "console.log(require('./site/data/canonical.json').through_week)")
          FILM=$(node -e "try{console.log(require('./site/cinematics/editions.json').documentary.through_week)}catch(e){console.log(0)}")
          BUSY=$(gh run list --workflow render-films.yml --json status -q '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 1)
          echo "site through week $SITE, films through week $FILM, renders in progress $BUSY"
          if [ "$SITE" -gt "$FILM" ] && [ "$BUSY" = "0" ]; then gh workflow run render-films.yml --ref main && echo "::notice::film render started for week $SITE" || echo "::warning::could not start the film render"; fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install the test browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser regression test (every route, phone and desktop, after each interaction)
        run: python tests/site_test.py --ci
      - name: Regression checks for fixed defects (exports, film links, modal focus, route context, one win chance)
        run: python tests/regression_test.py
      - name: Commit data if changed
        run: |
          git config user.name "sleeper-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          # Another run may have committed data since this one checked out. The data files are generated, so on a clash keep this run's (newer) copy.
          # If that still cannot be applied, skip the data commit instead of failing: the next run will commit.
          git diff --cached --quiet || { git commit -m "Refresh Sleeper data"; git pull --rebase -X theirs --autostash origin main && git push || { git rebase --abort 2>/dev/null; echo "::warning::data commit skipped; the next run will commit"; }; }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Lay the weekly films over the site (from the films branch, if it exists)
        run: |
          if git fetch --depth=1 origin films 2>/dev/null; then git archive FETCH_HEAD | tar -x; ls site/cinematics | grep -c -- '-v2.mp4' || true; else echo "no films branch yet"; fi
      - uses: actions/configure-pages@v5
      - name: Version the stylesheet and script links
        # Phones were keeping an old app.css after a deploy. Each deploy now links assets as file?v=<commit>, so a new deploy is always fetched.
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(assets/[A-Za-z0-9_-]+\.(css|js))\"#\1?v=${V}\"#g" site/*.html site/*/index.html
          grep -c "?v=${V}" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
